<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Use Case Prioritiser | Simpson Associates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/gitbrent/PptxGenJS@v3.12.0/dist/pptxgen.bundle.js"></script>
<style>
  :root {
    --sa-navy: #0F2D52;
    --sa-navy-deep: #081A33;
    --sa-teal: #00B0B9;
    --sa-teal-deep: #008B92;
    --sa-green: #6FCF73;
    --sa-coral: #FF6B5B;
    --sa-amber: #F4B73E;
    --sa-cream: #F7F5EF;
    --sa-paper: #FAFAF7;
    --sa-ink: #0B1726;
    --sa-mute: #5A6573;
    --sa-line: #E3E1D8;
    --shadow-soft: 0 1px 2px rgba(11,23,38,0.04), 0 8px 24px rgba(11,23,38,0.06);
    --shadow-lift: 0 4px 12px rgba(11,23,38,0.08), 0 24px 48px rgba(11,23,38,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { font-family: 'Manrope', system-ui, sans-serif; background: var(--sa-paper); color: var(--sa-ink); -webkit-font-smoothing: antialiased; }
  #root { min-height: 100vh; }

  /* Hex motif background — subtle */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      radial-gradient(circle at 10% 5%, rgba(0,176,185,0.04) 0, transparent 35%),
      radial-gradient(circle at 90% 90%, rgba(15,45,82,0.04) 0, transparent 40%);
    pointer-events: none;
    z-index: 0;
  }

  .app { position: relative; z-index: 1; }

  /* Header */
  .topbar {
    background: var(--sa-navy);
    color: white;
    padding: 18px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 3px solid var(--sa-teal);
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-mark {
    width: 38px; height: 44px;
    display: grid; place-items: center;
    position: relative;
  }
  .brand-mark svg { width: 100%; height: 100%; }
  .brand-text { display: flex; flex-direction: column; line-height: 1.05; }
  .brand-text .sa { font-weight: 800; font-size: 18px; letter-spacing: 0.5px; }
  .brand-text .sub { font-size: 11px; color: rgba(255,255,255,0.65); letter-spacing: 1.2px; text-transform: uppercase; font-weight: 500; }
  .topbar-right { display: flex; align-items: center; gap: 20px; font-size: 13px; color: rgba(255,255,255,0.75); }
  .pill { background: rgba(0,176,185,0.18); color: var(--sa-teal); padding: 5px 12px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; border: 1px solid rgba(0,176,185,0.35); }

  /* Page */
  .page { max-width: 1180px; margin: 0 auto; padding: 48px 40px 80px; }

  /* Landing */
  .hero {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 60px;
    align-items: center;
    margin-bottom: 60px;
  }
  .eyebrow { color: var(--sa-teal-deep); font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 16px; }
  h1 {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 52px;
    font-weight: 400;
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: var(--sa-navy);
    margin-bottom: 20px;
  }
  h1 em { font-style: italic; color: var(--sa-teal-deep); }
  .lede { font-size: 18px; line-height: 1.55; color: var(--sa-mute); max-width: 520px; margin-bottom: 32px; }
  .cta-row { display: flex; gap: 14px; flex-wrap: wrap; }
  .btn {
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    padding: 14px 26px;
    border-radius: 6px;
    transition: all 0.18s ease;
    letter-spacing: 0.2px;
  }
  .btn-primary {
    background: var(--sa-navy);
    color: white;
  }
  .btn-primary:hover { background: var(--sa-navy-deep); transform: translateY(-1px); }
  .btn-secondary {
    background: white;
    color: var(--sa-navy);
    border: 1.5px solid var(--sa-navy);
  }
  .btn-secondary:hover { background: var(--sa-navy); color: white; }
  .btn-ghost {
    background: transparent;
    color: var(--sa-navy);
    text-decoration: underline;
    text-underline-offset: 4px;
    padding: 14px 8px;
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Hex visual on right */
  .hex-stack {
    position: relative;
    height: 440px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hex {
    position: absolute;
    width: 140px; height: 161px;
    display: grid; place-items: center;
    color: white;
    font-weight: 700;
    text-align: center;
    padding: 0 16px;
    line-height: 1.2;
  }
  .hex svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hex span { position: relative; z-index: 1; font-size: 13px; letter-spacing: 0.5px; text-transform: uppercase; }
  .hex.value { background: transparent; left: 35%; top: 20%; }
  .hex.value svg path { fill: var(--sa-teal); }
  .hex.risk { left: 55%; top: 40%; }
  .hex.risk svg path { fill: var(--sa-navy); }
  .hex.readiness { left: 40%; top: 60%; }
  .hex.readiness svg path { fill: var(--sa-green); }

  /* Cards row */
  .three-up { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin-top: 16px; }
  .card {
    background: white;
    border: 1px solid var(--sa-line);
    border-radius: 8px;
    padding: 26px 24px;
    box-shadow: var(--shadow-soft);
    position: relative;
    overflow: hidden;
  }
  .card .stripe {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--sa-teal);
  }
  .card.value .stripe { background: var(--sa-teal); }
  .card.risk .stripe { background: var(--sa-navy); }
  .card.readiness .stripe { background: var(--sa-green); }
  .card-num { font-family: 'Source Serif 4', serif; font-size: 36px; font-weight: 300; color: var(--sa-navy); margin-bottom: 4px; line-height: 1; font-style: italic; }
  .card h3 { font-size: 17px; font-weight: 700; color: var(--sa-navy); margin-bottom: 8px; letter-spacing: -0.2px; }
  .card p { font-size: 14px; color: var(--sa-mute); line-height: 1.55; }

  /* Customer chooser */
  .examples-section { margin-top: 64px; padding-top: 48px; border-top: 1px solid var(--sa-line); }
  .examples-section h2 { font-family: 'Source Serif 4', serif; font-size: 28px; font-weight: 400; color: var(--sa-navy); margin-bottom: 8px; letter-spacing: -0.01em; }
  .examples-section p.lead { color: var(--sa-mute); font-size: 15px; margin-bottom: 24px; }
  .case-card {
    background: white;
    border: 1px solid var(--sa-line);
    border-radius: 8px;
    padding: 24px;
    cursor: pointer;
    transition: all 0.18s ease;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .case-card:hover { border-color: var(--sa-teal); box-shadow: var(--shadow-lift); transform: translateY(-2px); }
  .case-sector { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--sa-teal-deep); font-weight: 700; }
  .case-card h4 { font-size: 17px; color: var(--sa-navy); font-weight: 700; line-height: 1.25; }
  .case-card p { font-size: 13px; color: var(--sa-mute); line-height: 1.55; }
  .case-stats { display: flex; gap: 12px; margin-top: 6px; }
  .case-stat { background: var(--sa-cream); padding: 6px 10px; border-radius: 4px; font-size: 11px; color: var(--sa-navy); font-weight: 600; }

  /* Assessment screen */
  .assess-wrap { max-width: 880px; margin: 0 auto; }
  .progress-bar { display: flex; gap: 6px; margin-bottom: 32px; }
  .progress-seg {
    flex: 1;
    height: 6px;
    border-radius: 3px;
    background: var(--sa-line);
    transition: background 0.25s ease;
  }
  .progress-seg.done { background: var(--sa-teal); }
  .progress-seg.current { background: var(--sa-navy); }

  .dimension-badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .dimension-badge.value { background: rgba(0,176,185,0.12); color: var(--sa-teal-deep); }
  .dimension-badge.risk { background: rgba(15,45,82,0.08); color: var(--sa-navy); }
  .dimension-badge.readiness { background: rgba(111,207,115,0.18); color: #2E7A3A; }
  .dimension-badge::before {
    content: ''; width: 8px; height: 8px; border-radius: 50%;
  }
  .dimension-badge.value::before { background: var(--sa-teal); }
  .dimension-badge.risk::before { background: var(--sa-navy); }
  .dimension-badge.readiness::before { background: var(--sa-green); }

  .question-text {
    font-family: 'Source Serif 4', serif;
    font-size: 30px;
    font-weight: 400;
    line-height: 1.25;
    color: var(--sa-navy);
    margin-bottom: 12px;
    letter-spacing: -0.01em;
  }
  .question-context { color: var(--sa-mute); font-size: 15px; line-height: 1.55; margin-bottom: 32px; max-width: 700px; }
  .q-counter { font-size: 12px; color: var(--sa-mute); letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; margin-bottom: 14px; }

  .scale {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 36px;
  }
  .scale-option {
    background: white;
    border: 1.5px solid var(--sa-line);
    border-radius: 8px;
    padding: 18px 14px;
    cursor: pointer;
    transition: all 0.16s ease;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 130px;
  }
  .scale-option:hover { border-color: var(--sa-teal); transform: translateY(-2px); box-shadow: var(--shadow-soft); }
  .scale-option.selected {
    border-color: var(--sa-navy);
    background: var(--sa-navy);
    color: white;
  }
  .scale-option .num {
    font-family: 'Source Serif 4', serif;
    font-size: 30px;
    font-weight: 300;
    font-style: italic;
    line-height: 1;
  }
  .scale-option.selected .num { color: var(--sa-teal); }
  .scale-option .lbl { font-size: 12px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; }
  .scale-option .desc { font-size: 11px; line-height: 1.45; opacity: 0.85; flex: 1; }

  .nav-row { display: flex; justify-content: space-between; align-items: center; }
  .skip-link { color: var(--sa-mute); font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; }
  .skip-link:hover { color: var(--sa-navy); }

  /* Results */
  .results-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 40px; align-items: start; margin-bottom: 40px; }
  .verdict-card { background: var(--sa-navy); color: white; border-radius: 10px; padding: 36px; position: relative; overflow: hidden; }
  .verdict-card::after {
    content: '';
    position: absolute;
    right: -40px; bottom: -40px;
    width: 220px; height: 220px;
    background: radial-gradient(circle, rgba(0,176,185,0.25) 0, transparent 65%);
    pointer-events: none;
  }
  .verdict-eyebrow { color: var(--sa-teal); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; margin-bottom: 14px; }
  .verdict-card h2 { font-family: 'Source Serif 4', serif; font-size: 36px; font-weight: 400; line-height: 1.15; margin-bottom: 14px; letter-spacing: -0.01em; }
  .verdict-card p { color: rgba(255,255,255,0.78); font-size: 15px; line-height: 1.55; margin-bottom: 22px; }
  .verdict-recommendation {
    background: rgba(255,255,255,0.08);
    border-left: 3px solid var(--sa-teal);
    padding: 14px 18px;
    border-radius: 4px;
    font-size: 14px;
    line-height: 1.55;
  }

  .scores-list { display: flex; flex-direction: column; gap: 16px; }
  .score-row {
    background: white;
    border: 1px solid var(--sa-line);
    border-radius: 8px;
    padding: 18px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: all 0.18s ease;
  }
  .score-row:hover { border-color: var(--sa-teal); transform: translateY(-1px); box-shadow: var(--shadow-soft); }
  .score-row.expanded { border-color: var(--sa-navy); }
  .score-row-left { flex: 1; }
  .score-row-label-row { display: flex; align-items: center; gap: 8px; }
  .score-row-chevron { color: var(--sa-mute); font-size: 12px; transition: transform 0.2s ease; }
  .score-row.expanded .score-row-chevron { transform: rotate(90deg); color: var(--sa-teal-deep); }
  .score-row-label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; margin-bottom: 6px; }
  .score-row.value .score-row-label { color: var(--sa-teal-deep); }
  .score-row.risk .score-row-label { color: var(--sa-navy); }
  .score-row.readiness .score-row-label { color: #2E7A3A; }
  .score-row-meter { height: 6px; background: var(--sa-cream); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .score-row-fill { height: 100%; border-radius: 3px; transition: width 0.6s cubic-bezier(.2,.8,.2,1); }
  .score-row.value .score-row-fill { background: var(--sa-teal); }
  .score-row.risk .score-row-fill { background: var(--sa-navy); }
  .score-row.readiness .score-row-fill { background: var(--sa-green); }
  .score-row-value { font-family: 'Source Serif 4', serif; font-size: 38px; font-weight: 300; font-style: italic; color: var(--sa-navy); line-height: 1; margin-left: 22px; }
  .score-row-value small { font-size: 14px; color: var(--sa-mute); font-style: normal; font-family: 'Manrope', sans-serif; }

  /* Detail panel */
  .detail-panel {
    background: white;
    border: 1px solid var(--sa-line);
    border-radius: 10px;
    padding: 28px;
    margin-bottom: 24px;
  }
  .detail-panel h4 {
    font-family: 'Source Serif 4', serif;
    font-size: 22px;
    font-weight: 400;
    color: var(--sa-navy);
    margin-bottom: 4px;
    letter-spacing: -0.01em;
  }
  .detail-panel .detail-sub {
    color: var(--sa-mute);
    font-size: 13px;
    margin-bottom: 22px;
  }
  .detail-row {
    display: flex;
    gap: 16px;
    padding: 16px 0;
    border-bottom: 1px solid var(--sa-line);
    align-items: flex-start;
  }
  .detail-row:last-child { border-bottom: 0; }
  .detail-score-pill {
    flex-shrink: 0;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--sa-cream);
    display: grid;
    place-items: center;
    font-family: 'Source Serif 4', serif;
    font-size: 26px;
    font-style: italic;
    font-weight: 300;
    color: var(--sa-navy);
    border: 2px solid var(--sa-line);
  }
  .detail-panel.value .detail-score-pill { background: rgba(0,176,185,0.10); border-color: rgba(0,176,185,0.3); }
  .detail-panel.risk .detail-score-pill { background: rgba(15,45,82,0.08); border-color: rgba(15,45,82,0.2); }
  .detail-panel.readiness .detail-score-pill { background: rgba(111,207,115,0.18); border-color: rgba(111,207,115,0.4); }
  .detail-q-text {
    font-size: 14px;
    font-weight: 700;
    color: var(--sa-navy);
    margin-bottom: 4px;
    line-height: 1.4;
  }
  .detail-q-answer {
    font-size: 13px;
    color: var(--sa-mute);
    margin-bottom: 8px;
  }
  .detail-q-answer strong { color: var(--sa-ink); }
  .detail-q-rationale {
    font-size: 13px;
    line-height: 1.55;
    color: var(--sa-ink);
    font-style: italic;
    background: var(--sa-cream);
    padding: 10px 14px;
    border-left: 3px solid var(--sa-teal);
    border-radius: 4px;
  }
  .detail-q-rationale-empty {
    font-size: 12px;
    color: var(--sa-mute);
    font-style: italic;
  }

  /* Matrix */
  .matrix-section { background: white; border: 1px solid var(--sa-line); border-radius: 10px; padding: 32px; margin-bottom: 32px; }
  .matrix-section h3 { font-family: 'Source Serif 4', serif; font-size: 22px; font-weight: 400; color: var(--sa-navy); margin-bottom: 6px; letter-spacing: -0.01em; }
  .matrix-section .sub { color: var(--sa-mute); font-size: 13px; margin-bottom: 24px; }
  .matrix-wrap {
    position: relative;
    height: 480px;
    padding: 20px 30px 50px 80px;
  }
  .matrix-grid {
    position: relative;
    height: 100%;
    width: 100%;
    border-left: 2px solid var(--sa-line);
    border-bottom: 2px solid var(--sa-line);
  }
  .matrix-quadrant {
    position: absolute;
    width: 50%;
    height: 50%;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 14px 18px;
  }
  .matrix-quadrant.tl { top: 0; left: 0; background: rgba(0,176,185,0.04); }
  .matrix-quadrant.tr { top: 0; right: 0; background: rgba(0,176,185,0.10); }
  .matrix-quadrant.bl { bottom: 0; left: 0; background: rgba(90,101,115,0.04); }
  .matrix-quadrant.br { bottom: 0; right: 0; background: rgba(244,183,62,0.08); }
  .matrix-quad-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--sa-mute); font-weight: 700; }
  .matrix-quad-title { font-size: 14px; font-weight: 700; color: var(--sa-navy); margin-top: 4px; }
  .matrix-quadrant.tr .matrix-quad-label { color: var(--sa-teal-deep); }

  /* Y axis label using writing-mode for clean vertical text */
  .matrix-ylabel {
    position: absolute;
    left: 15px;
    top: 0;
    bottom: 50px;
    width: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    writing-mode: vertical-rl;
    color: var(--sa-mute);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 700;
    pointer-events: none;
  }
  .matrix-xlabel {
    position: absolute;
    bottom: 16px;
    left: 80px;
    right: 30px;
    text-align: center;
    color: var(--sa-mute);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 700;
    pointer-events: none;
  }

  .matrix-point {
    position: absolute;
    border-radius: 50%;
    background: var(--sa-navy);
    color: white;
    display: grid; place-items: center;
    font-weight: 700;
    font-size: 13px;
    transform: translate(-50%, 50%);
    box-shadow: 0 4px 16px rgba(15,45,82,0.35);
    border: 3px solid white;
    cursor: pointer;
    transition: transform 0.2s ease;
    z-index: 2;
  }
  .matrix-point:hover { transform: translate(-50%, 50%) scale(1.08); }
  .matrix-point-label {
    position: absolute;
    bottom: calc(100% + 10px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--sa-navy);
    color: white;
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
    letter-spacing: 0.3px;
    box-shadow: 0 4px 12px rgba(15,45,82,0.2);
  }
  .matrix-point-label::after {
    content: ''; position: absolute;
    top: 100%; left: 50%; transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: var(--sa-navy);
  }

  /* Result actions */
  .actions-bar { display: flex; gap: 12px; flex-wrap: wrap; justify-content: flex-end; margin-bottom: 24px; }

  /* Footer */
  .footer-bar {
    margin-top: 80px;
    border-top: 1px solid var(--sa-line);
    padding: 28px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--sa-mute);
    background: var(--sa-paper);
  }
  .footer-bar .badge-row { display: flex; gap: 16px; align-items: center; }

  @media (max-width: 900px) {
    .hero { grid-template-columns: 1fr; }
    .hex-stack { display: none; }
    .results-grid { grid-template-columns: 1fr; }
    .scale { grid-template-columns: repeat(2, 1fr); }
    h1 { font-size: 38px; }
    .page { padding: 32px 24px 60px; }
    .topbar { padding: 14px 20px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo, useRef, useEffect } = React;

// ============================================================
// QUESTIONS — 5 per dimension, 15 total
// ============================================================
const QUESTIONS = {
  value: [
    {
      id: 'v1',
      text: 'How many people will benefit from this on a daily basis?',
      context: 'Think about who is directly affected — staff time saved, decisions improved, customers better served.',
      scale: [

function Assessment({ scores, setScores, onComplete, onBack, customerName, setCustomerName, useCaseName, setUseCaseName }) {

  const total = FLAT_QUESTIONS.length;

  const select = (v) => {

    setTimeout(() => {

function avg(scores, ids) {
  const vals = ids.map(id => scores[id]).filter(v => typeof v === 'number');
  if (!vals.length) return 0;
  return vals.reduce((a,b) => a+b, 0) / vals.length;
}

function getVerdict(value, risk, readiness) {
  if (value >= 3.5 && risk <= 3 && readiness >= 3.5) {
    return {
      title: 'Lighthouse — start now.',
      summary: 'High value, manageable risk, strong readiness. This is the use case to fund, sponsor and turn into a story.',
      recommendation: 'Recommend a 6–8 week Proof of Value engagement. Embed responsible-AI guardrails from day one. Position as a sector lighthouse so the success unlocks the wider portfolio.',
    };
  }
  if (value >= 3.5 && risk >= 3.5) {
    return {
      title: 'High reward, but eyes wide open.',
      summary: 'Real value sits inside this use case — but so does material risk. Treat as strategic, not a quick win.',
      recommendation: 'Begin with an AI Readiness Assessment and a focused Responsible AI design phase. Engage the Ethics & Risk Review Board early. Structure delivery in phased gates with human-in-the-loop by default.',
    };
  }
  if (value >= 3.5 && readiness < 3) {
    return {
      title: 'Valuable, but not yet deliverable.',
      summary: 'The prize is real, but the organisation isn\'t ready to capture it today.',
      recommendation: 'Park as a target use case. Use this assessment to define the foundation work needed — data, platform, sponsorship, governance — and revisit in 3–6 months.',
    };
  }
  if (value < 2.5 && risk < 2.5) {
    return {
      title: 'Quick win — useful, but not the headline.',
      summary: 'Low-risk and easy to deliver. Worth doing for productivity, but unlikely to be the case study Simpson builds the year around.',
      recommendation: 'Deliver as a packaged productivity engagement. Use it to demonstrate momentum while higher-value use cases mature.',
    };
  }
  return {
    title: 'Worth a closer conversation.',
    summary: 'The numbers don\'t scream "go" or "park" — which usually means the next step is shaping, not scoring.',
    recommendation: 'Run a focused half-day workshop with the use case sponsor to sharpen scope, sharpen the value hypothesis and decide whether to invest in a Proof of Value.',
  };
}

  const verdict = getVerdict(valueScore, riskScore, readinessScore);

  const xPct = (valueScore / 5) * 100;

        </div>
        <div style={{ display: 'flex', gap: 10 }}>
          <button className="btn btn-secondary" onClick={onRestart}>↺ Start over</button>
          <button className="btn btn-primary" onClick={onExport}>↓ Export to PowerPoint</button>
        </div>
      </div>

      <div className="results-grid">
        <div className="verdict-card">
          <div className="verdict-eyebrow">The Verdict</div>
          <h2>{verdict.title}</h2>
          <p>{verdict.summary}</p>
          <div className="verdict-recommendation">
            <strong style={{ color: 'var(--sa-teal)', display: 'block', marginBottom: 6, fontSize: 11, letterSpacing: 1.5, textTransform: 'uppercase' }}>Recommended Next Step</strong>
            {verdict.recommendation}
          </div>
        </div>

        <div className="scores-list">
          {[
            { dim: 'value', label: 'Value', score: valueScore, max: 5, hint: 'Click to see how this score is built' },
            { dim: 'risk', label: 'Risk', score: riskScore, max: 5, hint: 'Click to see how this score is built' },
            { dim: 'readiness', label: 'Readiness', score: readinessScore, max: 5, hint: 'Click to see how this score is built' },
          ].map(s => (
            <div
              key={s.dim}
              className={`score-row ${s.dim} ${expandedDim === s.dim ? 'expanded' : ''}`}
              onClick={() => setExpandedDim(expandedDim === s.dim ? null : s.dim)}
            >
              <div className="score-row-left">
                <div className="score-row-label-row">
                  <div className="score-row-label">{s.label}</div>
                  <span className="score-row-chevron">▸</span>
                </div>
                <div className="score-row-meter">
                  <div className="score-row-fill" style={{ width: `${(s.score/s.max)*100}%` }} />
                </div>
              </div>
              <div className="score-row-value">{s.score.toFixed(1)}<small>/5</small></div>
            </div>
          ))}
        </div>
      </div>

      {expandedDim && (
        <div className={`detail-panel ${expandedDim}`}>
          <h4>{
            expandedDim === 'value' ? 'How the Value score is built'
            : expandedDim === 'risk' ? 'How the Risk score is built'
            : 'How the Readiness score is built'
          }</h4>
          <p className="detail-sub">
            {expandedDim === 'value' && 'Five questions on reach, time, outcomes, financial impact and visibility.'}
            {expandedDim === 'risk' && 'Five questions on data sensitivity, autonomy, regulation, failure impact and workforce reception.'}
            {expandedDim === 'readiness' && 'Five questions on data, platform, sponsorship, governance and time-to-start.'}
          </p>

          {QUESTIONS[expandedDim].map(q => {
            const answer = scores[q.id];
            const opt = q.scale.find(o => o.v === answer);
            const note = rationale && rationale[q.id];
            return (
              <div key={q.id} className="detail-row">
                <div className="detail-score-pill">{answer || '—'}</div>
                <div style={{ flex: 1 }}>
                  <div className="detail-q-text">{q.text}</div>
                  {opt && (
                    <div className="detail-q-answer">
                      Answer: <strong>{opt.label}</strong> — {opt.desc}
                    </div>
                  )}
                  {note ? (
                    <div className="detail-q-rationale">"{note}"</div>
                  ) : (
                    <div className="detail-q-rationale-empty">No rationale captured for this question.</div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}

      <div className="matrix-section">
        <h3>Value vs Risk — sized by Readiness</h3>
        <p className="sub">Where on the prioritisation map does this use case land?</p>

        <div className="matrix-wrap">
          <span className="matrix-ylabel">Lower risk · ↓ · Higher risk</span>
          <span className="matrix-xlabel">← Lower value · Higher value →</span>

          <div className="matrix-grid">
            <div className="matrix-quadrant tl">
              <div className="matrix-quad-label">Top Left</div>
              <div className="matrix-quad-title">Strategic but speculative</div>
            </div>
            <div className="matrix-quadrant tr">
              <div className="matrix-quad-label">★ The sweet spot</div>
              <div className="matrix-quad-title">Lighthouse use case</div>
            </div>
            <div className="matrix-quadrant bl">
              <div className="matrix-quad-label">Bottom Left</div>
              <div className="matrix-quad-title">Park or descope</div>
            </div>
            <div className="matrix-quadrant br">
              <div className="matrix-quad-label">Bottom Right</div>
              <div className="matrix-quad-title">High reward, eyes open</div>
            </div>

            <div
              className="matrix-point"
              style={{
                left: `${Math.min(95, Math.max(5, xPct))}%`,
                bottom: `${Math.min(95, Math.max(5, yPct))}%`,
                width: bubbleSize,
                height: bubbleSize,
                fontSize: bubbleSize < 50 ? 11 : 13,
              }}
              title={`Value ${valueScore.toFixed(1)} · Risk ${riskScore.toFixed(1)} · Readiness ${readinessScore.toFixed(1)}`}
            >
              <div className="matrix-point-label">{customerName} · {readinessScore.toFixed(1)} ready</div>
              {valueScore.toFixed(1)}
            </div>
          </div>
        </div>

        <p style={{ fontSize: 12, color: 'var(--sa-mute)', marginTop: 20, lineHeight: 1.55 }}>
          <strong style={{ color: 'var(--sa-navy)' }}>Reading the chart:</strong>{' '}
          Up-and-right is the sweet spot — high value, low risk. The bubble size shows how ready the organisation is to actually deliver this use case today (larger = more ready).
        </p>
      </div>

      {isPreloaded && preloadedHeadlines && (
        <div className="matrix-section" style={{ background: 'var(--sa-cream)', borderColor: 'var(--sa-line)' }}>
          <h3>What actually happened</h3>
          <p className="sub">The real-world outcomes from this Simpson Associates engagement.</p>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 20, marginTop: 14 }}>
            {preloadedHeadlines.map((h, i) => (
              <div key={i}>
                <div style={{
                  fontFamily: 'Source Serif 4, serif',
                  fontSize: 48, fontWeight: 300, fontStyle: 'italic',
                  color: 'var(--sa-navy)', lineHeight: 1, marginBottom: 8,
                }}>{h.stat}</div>
                <div style={{ fontSize: 13, color: 'var(--sa-mute)', lineHeight: 1.5 }}>{h.label}</div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// PPTX EXPORT
// ============================================================
function exportPpt(scores, customerName, useCaseName, isPreloaded, preloadedHeadlines, rationale) {
  const pptx = new PptxGenJS();
  pptx.title = `${customerName} — AI Use Case Assessment`;
  pptx.author = 'Simpson Associates';
  pptx.layout = 'LAYOUT_WIDE'; // 13.3 x 7.5

  const TEAL = '00B0B9';
  const GREEN = '6FCF73';
  const CREAM = 'F7F5EF';
  const MUTE = '5A6573';
  const PAPER = 'FAFAF7';
  const INK = '0B1726';

  const valueScore = avg(scores, QUESTIONS.value.map(q => q.id));
  const riskScore = avg(scores, QUESTIONS.risk.map(q => q.id));

  // ---------- SLIDE 1: COVER ----------

  s1.addText('Simpson Associates · AI Use Case Prioritiser', { x: 0.6, y: 0.55, w: 8, h: 0.4, fontSize: 11, color: TEAL, fontFace: 'Calibri', bold: true, charSpacing: 3 });

  s1.addText(customerName, { x: 0.6, y: 1.5, w: 11, h: 0.7, fontSize: 22, color: 'FFFFFF', fontFace: 'Calibri', bold: true, charSpacing: 1 });

  // Three-up summary chips
  const chipY = 5.6;
  [
    { label: 'VALUE', score: valueScore, colour: TEAL },
    { label: 'RISK', score: riskScore, colour: 'FFFFFF' },
    { label: 'READINESS', score: readinessScore, colour: GREEN },
  ].forEach((c, i) => {
    const x = 0.6 + i * 4;
    s1.addShape(pptx.ShapeType.rect, { x, y: chipY, w: 3.6, h: 1.3, fill: { color: '081A33' }, line: { color: c.colour, width: 1 } });
    s1.addText(c.label, { x: x + 0.2, y: chipY + 0.15, w: 3.3, h: 0.3, fontSize: 10, color: c.colour, fontFace: 'Calibri', bold: true, charSpacing: 3 });

    s1.addText('/ 5', { x: x + 1.6, y: chipY + 0.7, w: 1, h: 0.5, fontSize: 14, color: MUTE, fontFace: 'Calibri' });

  s1.addText('A simple way to score AI use cases on value, risk and readiness — built for purpose-led organisations.', { x: 0.6, y: 6.95, w: 11, h: 0.4, fontSize: 11, color: 'AAB4C2', fontFace: 'Calibri', italic: true });

  // ---------- SLIDE 2: THE VERDICT ----------
  const s2 = pptx.addSlide();
  s2.background = { color: PAPER };

  s2.addText('THE VERDICT', { x: 0.6, y: 0.5, w: 10, h: 0.35, fontSize: 11, color: TEAL, fontFace: 'Calibri', bold: true, charSpacing: 3 });
  s2.addText(customerName + ' · ' + useCaseName, { x: 0.6, y: 0.85, w: 12, h: 0.35, fontSize: 13, color: MUTE, fontFace: 'Calibri' });

  s2.addText(verdict.title, { x: 0.6, y: 1.4, w: 12, h: 1.2, fontSize: 38, color: NAVY, fontFace: 'Georgia' });
  s2.addText(verdict.summary, { x: 0.6, y: 2.8, w: 12, h: 0.9, fontSize: 16, color: INK, fontFace: 'Calibri', italic: false });

  // Recommendation block
  s2.addShape(pptx.ShapeType.rect, { x: 0.6, y: 4.0, w: 12.1, h: 1.6, fill: { color: NAVY }, line: { color: NAVY } });
  s2.addShape(pptx.ShapeType.rect, { x: 0.6, y: 4.0, w: 0.08, h: 1.6, fill: { color: TEAL }, line: { color: TEAL } });
  s2.addText('RECOMMENDED NEXT STEP', { x: 0.85, y: 4.15, w: 8, h: 0.3, fontSize: 10, color: TEAL, fontFace: 'Calibri', bold: true, charSpacing: 3 });
  s2.addText(verdict.recommendation, { x: 0.85, y: 4.5, w: 11.6, h: 1, fontSize: 14, color: 'FFFFFF', fontFace: 'Calibri', valign: 'top' });

  // Footer
  s2.addText('Simpson Associates · AI Use Case Prioritiser', { x: 0.6, y: 7.1, w: 8, h: 0.3, fontSize: 9, color: MUTE, fontFace: 'Calibri' });
  s2.addText('Page 2 of 5', { x: 11, y: 7.1, w: 1.7, h: 0.3, fontSize: 9, color: MUTE, fontFace: 'Calibri', align: 'right' });

  // ---------- SLIDE 3: SCORE BREAKDOWN ----------
  const s3 = pptx.addSlide();
  s3.background = { color: PAPER };

  s3.addText('SCORE BREAKDOWN', { x: 0.6, y: 0.5, w: 10, h: 0.35, fontSize: 11, color: TEAL, fontFace: 'Calibri', bold: true, charSpacing: 3 });
  s3.addText('Three dimensions, fifteen questions', { x: 0.6, y: 0.85, w: 12, h: 0.6, fontSize: 28, color: NAVY, fontFace: 'Georgia' });

  // Three score cards
  const cardY = 1.9;
  const cardData = [
    { label: 'VALUE', score: valueScore, colour: TEAL, blurb: 'Reach, time saved, outcomes, financial impact and visibility.' },
    { label: 'RISK', score: riskScore, colour: NAVY, blurb: 'Data sensitivity, autonomy, regulation, failure impact and adoption.' },
    { label: 'READINESS', score: readinessScore, colour: GREEN, blurb: 'Data, platform, sponsorship, governance and realistic time-to-start.' },
  ];
  cardData.forEach((c, i) => {
    const x = 0.6 + i * 4.1;
    s3.addShape(pptx.ShapeType.rect, { x, y: cardY, w: 3.85, h: 4.6, fill: { color: 'FFFFFF' }, line: { color: 'E3E1D8' } });
    s3.addShape(pptx.ShapeType.rect, { x, y: cardY, w: 3.85, h: 0.08, fill: { color: c.colour }, line: { color: c.colour } });
    s3.addText(c.label, { x: x + 0.3, y: cardY + 0.3, w: 3.3, h: 0.3, fontSize: 11, color: c.colour, fontFace: 'Calibri', bold: true, charSpacing: 3 });
    s3.addText(`${c.score.toFixed(1)}`, { x: x + 0.3, y: cardY + 0.8, w: 3.3, h: 1.6, fontSize: 84, color: NAVY, fontFace: 'Georgia', italic: true });
    s3.addText('/ 5', { x: x + 2.2, y: cardY + 1.65, w: 1.4, h: 0.5, fontSize: 18, color: MUTE, fontFace: 'Calibri' });

    // Mini-bar
    s3.addShape(pptx.ShapeType.rect, { x: x + 0.3, y: cardY + 2.6, w: 3.3, h: 0.18, fill: { color: CREAM }, line: { color: CREAM } });
    s3.addShape(pptx.ShapeType.rect, { x: x + 0.3, y: cardY + 2.6, w: 3.3 * (c.score / 5), h: 0.18, fill: { color: c.colour }, line: { color: c.colour } });

    s3.addText(c.blurb, { x: x + 0.3, y: cardY + 3.0, w: 3.3, h: 1.5, fontSize: 12, color: MUTE, fontFace: 'Calibri', valign: 'top' });
  });

  // Per-question detail
  s3.addText('Detail by question (1 lowest — 5 highest):', { x: 0.6, y: 6.7, w: 12, h: 0.3, fontSize: 10, color: MUTE, fontFace: 'Calibri', italic: true });

  // Footer
  s3.addText('Simpson Associates · AI Use Case Prioritiser', { x: 0.6, y: 7.1, w: 8, h: 0.3, fontSize: 9, color: MUTE, fontFace: 'Calibri' });
  s3.addText('Page 3 of 5', { x: 11, y: 7.1, w: 1.7, h: 0.3, fontSize: 9, color: MUTE, fontFace: 'Calibri', align: 'right' });

  // ---------- SLIDE 4: MATRIX ----------
  const s4 = pptx.addSlide();
  s4.background = { color: PAPER };

  s4.addText('VALUE vs RISK · sized by Readiness', { x: 0.6, y: 0.5, w: 10, h: 0.35, fontSize: 11, color: TEAL, fontFace: 'Calibri', bold: true, charSpacing: 3 });
  s4.addText('Where does this use case land on the prioritisation map?', { x: 0.6, y: 0.85, w: 12, h: 0.6, fontSize: 26, color: NAVY, fontFace: 'Georgia' });

  // Chart area
  const cx = 1.4, cy = 2.0, cw = 7, ch = 4.6;

  // Quadrants
  s4.addShape(pptx.ShapeType.rect, { x: cx, y: cy, w: cw/2, h: ch/2, fill: { color: 'F0F7F8' }, line: { color: 'E3E1D8' } });
  s4.addShape(pptx.ShapeType.rect, { x: cx + cw/2, y: cy, w: cw/2, h: ch/2, fill: { color: 'F5F1E5' }, line: { color: 'E3E1D8' } });
  s4.addShape(pptx.ShapeType.rect, { x: cx, y: cy + ch/2, w: cw/2, h: ch/2, fill: { color: 'F0EFEC' }, line: { color: 'E3E1D8' } });
  s4.addShape(pptx.ShapeType.rect, { x: cx + cw/2, y: cy + ch/2, w: cw/2, h: ch/2, fill: { color: 'F8EFEC' }, line: { color: 'E3E1D8' } });

  // Quadrant labels
  s4.addText('Strategic but\nspeculative', { x: cx + 0.15, y: cy + 0.15, w: cw/2 - 0.3, h: 0.6, fontSize: 10, color: MUTE, fontFace: 'Calibri', bold: true });
  s4.addText('LIGHTHOUSE\nUSE CASE', { x: cx + cw/2 + 0.15, y: cy + 0.15, w: cw/2 - 0.3, h: 0.6, fontSize: 11, color: TEAL, fontFace: 'Calibri', bold: true, charSpacing: 1 });
  s4.addText('Park or\ndescope', { x: cx + 0.15, y: cy + ch - 0.7, w: cw/2 - 0.3, h: 0.6, fontSize: 10, color: MUTE, fontFace: 'Calibri', bold: true });
  s4.addText('High reward,\neyes open', { x: cx + cw/2 + 0.15, y: cy + ch - 0.7, w: cw/2 - 0.3, h: 0.6, fontSize: 10, color: MUTE, fontFace: 'Calibri', bold: true });

  // Bubble position: x = value/5, y = (5-risk)/5 from TOP
  const bx = cx + (valueScore / 5) * cw;
  const by = cy + ((riskScore - 0) / 5) * ch; // risk from top — actually we want low risk near top
  // Recalc: y from top = (risk/5) * ch, so high risk = bottom. Wait we want low risk at top.
  // bottom = (5-risk)/5 means y from top = risk/5 * ch
  const byCorrect = cy + (riskScore / 5) * ch;
  const bubble = 0.4 + (readinessScore / 5) * 0.5; // 0.4 - 0.9 inches

  s4.addShape(pptx.ShapeType.ellipse, {
    x: bx - bubble/2,
    y: byCorrect - bubble/2,
    w: bubble,
    h: bubble,
    fill: { color: NAVY },
    line: { color: 'FFFFFF', width: 3 },
  });
  s4.addText(valueScore.toFixed(1), {
    x: bx - bubble/2,
    y: byCorrect - bubble/2,
    w: bubble,
    h: bubble,
    fontSize: bubble < 0.55 ? 10 : 13,
    color: 'FFFFFF',
    fontFace: 'Calibri',
    bold: true,
    align: 'center',
    valign: 'middle',
  });

  // Axes labels — properly placed
  s4.addText('← Lower value     ·     Higher value →', { x: cx, y: cy + ch + 0.1, w: cw, h: 0.3, fontSize: 10, color: MUTE, fontFace: 'Calibri', align: 'center', bold: true });

  // Y-axis labels — separate items, properly placed
  s4.addText('↑ Lower risk', { x: 0.3, y: cy + 0.2, w: 1.0, h: 0.4, fontSize: 9, color: MUTE, fontFace: 'Calibri', bold: true, align: 'left' });
  s4.addText('↓ Higher risk', { x: 0.3, y: cy + ch - 0.5, w: 1.0, h: 0.4, fontSize: 9, color: MUTE, fontFace: 'Calibri', bold: true, align: 'left' });

  // Side panel with the result
  const px = 9.2;
  s4.addShape(pptx.ShapeType.rect, { x: px, y: 2.0, w: 3.5, h: 4.6, fill: { color: 'FFFFFF' }, line: { color: 'E3E1D8' } });
  s4.addShape(pptx.ShapeType.rect, { x: px, y: 2.0, w: 0.08, h: 4.6, fill: { color: TEAL }, line: { color: TEAL } });
  s4.addText('THIS USE CASE', { x: px + 0.25, y: 2.2, w: 3.1, h: 0.3, fontSize: 10, color: TEAL, fontFace: 'Calibri', bold: true, charSpacing: 3 });
  s4.addText(customerName, { x: px + 0.25, y: 2.55, w: 3.1, h: 0.45, fontSize: 15, color: NAVY, fontFace: 'Calibri', bold: true });
  s4.addText(useCaseName, { x: px + 0.25, y: 3.05, w: 3.1, h: 1, fontSize: 12, color: INK, fontFace: 'Calibri', italic: true });

  s4.addText(`Value: ${valueScore.toFixed(1)} / 5`, { x: px + 0.25, y: 4.4, w: 3.1, h: 0.35, fontSize: 13, color: NAVY, fontFace: 'Calibri', bold: true });
  s4.addText(`Risk: ${riskScore.toFixed(1)} / 5`, { x: px + 0.25, y: 4.85, w: 3.1, h: 0.35, fontSize: 13, color: NAVY, fontFace: 'Calibri', bold: true });
  s4.addText(`Readiness: ${readinessScore.toFixed(1)} / 5`, { x: px + 0.25, y: 5.3, w: 3.1, h: 0.35, fontSize: 13, color: NAVY, fontFace: 'Calibri', bold: true });

  s4.addText('Up-and-right is the sweet spot. Larger bubble = readier to deliver.', { x: px + 0.25, y: 6.0, w: 3.1, h: 0.6, fontSize: 10, color: MUTE, fontFace: 'Calibri', italic: true });

  // Footer
  s4.addText('Simpson Associates · AI Use Case Prioritiser', { x: 0.6, y: 7.1, w: 8, h: 0.3, fontSize: 9, color: MUTE, fontFace: 'Calibri' });
  s4.addText('Page 4 of 5', { x: 11, y: 7.1, w: 1.7, h: 0.3, fontSize: 9, color: MUTE, fontFace: 'Calibri', align: 'right' });

  // ---------- SLIDE 5: QUESTION-BY-QUESTION DETAIL ----------
  const s5 = pptx.addSlide();
  s5.background = { color: PAPER };

  s5.addText('SCORING DETAIL', { x: 0.6, y: 0.4, w: 10, h: 0.3, fontSize: 11, color: TEAL, fontFace: 'Calibri', bold: true, charSpacing: 3 });
  s5.addText('How each score is built', { x: 0.6, y: 0.7, w: 12, h: 0.5, fontSize: 24, color: NAVY, fontFace: 'Georgia' });

  // Three columns
  const colData = [
    { dim: 'value', label: 'VALUE', colour: TEAL, qs: QUESTIONS.value },
    { dim: 'risk', label: 'RISK', colour: NAVY, qs: QUESTIONS.risk },
    { dim: 'readiness', label: 'READINESS', colour: '4A8E51', qs: QUESTIONS.readiness },
  ];

  const colW = 4.1;
  const colY = 1.5;
  const colX0 = 0.6;
  const colH = 5.5;

  colData.forEach((col, ci) => {
    const x = colX0 + ci * (colW + 0.05);

    // Column header
    s5.addShape(pptx.ShapeType.rect, { x, y: colY, w: colW, h: 0.4, fill: { color: col.colour }, line: { color: col.colour } });
    s5.addText(col.label, { x: x + 0.2, y: colY + 0.05, w: colW - 0.4, h: 0.3, fontSize: 11, color: 'FFFFFF', fontFace: 'Calibri', bold: true, charSpacing: 3 });

    // 5 questions stacked
    col.qs.forEach((q, qi) => {
      const qy = colY + 0.5 + qi * 1.0;
      const score = scores[q.id];
      const opt = q.scale.find(o => o.v === score);
      const note = rationale && rationale[q.id];

      // Card background
      s5.addShape(pptx.ShapeType.rect, { x, y: qy, w: colW, h: 0.95, fill: { color: 'FFFFFF' }, line: { color: 'E3E1D8' } });

      // Score pill
      s5.addShape(pptx.ShapeType.ellipse, { x: x + 0.15, y: qy + 0.18, w: 0.55, h: 0.55, fill: { color: 'F7F5EF' }, line: { color: col.colour, width: 1.5 } });
      s5.addText(`${score || '—'}`, { x: x + 0.15, y: qy + 0.18, w: 0.55, h: 0.55, fontSize: 18, color: NAVY, fontFace: 'Georgia', italic: true, align: 'center', valign: 'middle' });

      // Smart truncation — break at word boundaries
      const truncate = (str, maxLen) => {
        if (str.length <= maxLen) return str;
        const cut = str.substring(0, maxLen);
        const lastSpace = cut.lastIndexOf(' ');
        return (lastSpace > maxLen * 0.6 ? cut.substring(0, lastSpace) : cut) + '…';
      };

      // Question summary
      const qShort = truncate(q.text, 65);
      s5.addText(qShort, { x: x + 0.8, y: qy + 0.08, w: colW - 0.95, h: 0.34, fontSize: 9, color: NAVY, fontFace: 'Calibri', bold: true });

      // Answer label
      if (opt) {
        s5.addText(opt.label, { x: x + 0.8, y: qy + 0.4, w: colW - 0.95, h: 0.22, fontSize: 8, color: col.colour, fontFace: 'Calibri', bold: true });
      }

      // Rationale (or empty placeholder)
      if (note) {
        const noteShort = truncate(note, 160);
        s5.addText(noteShort, { x: x + 0.8, y: qy + 0.6, w: colW - 0.95, h: 0.32, fontSize: 7.5, color: MUTE, fontFace: 'Calibri', italic: true, valign: 'top' });
      }
    });
  });

  // Footer
  s5.addText('Simpson Associates · AI Use Case Prioritiser', { x: 0.6, y: 7.1, w: 8, h: 0.3, fontSize: 9, color: MUTE, fontFace: 'Calibri' });
  s5.addText('Page 5 of 5', { x: 11, y: 7.1, w: 1.7, h: 0.3, fontSize: 9, color: MUTE, fontFace: 'Calibri', align: 'right' });

  // Save
  const safeName = customerName.replace(/[^a-z0-9]/gi, '_');
  pptx.writeFile({ fileName: `${safeName}_AI_Use_Case_Assessment.pptx` });
}

// ============================================================
// ROOT
// ============================================================
function App() {
  const [stage, setStage] = useState('landing'); // landing | assess | results
  const [scores, setScores] = useState({});
  const [customerName, setCustomerName] = useState('');
  const [useCaseName, setUseCaseName] = useState('');
  const [isPreloaded, setIsPreloaded] = useState(false);
  const [preloadedHeadlines, setPreloadedHeadlines] = useState(null);
  const [rationale, setRationale] = useState(null);

  const startBlank = () => {
    setScores({});
    setCustomerName('');
    setUseCaseName('');
    setIsPreloaded(false);
    setPreloadedHeadlines(null);
    setRationale(null);
    setStage('assess');
  };

  const loadCase = (key) => {
    const c = PRELOADED[key];
    setScores(c.scores);
    setCustomerName(c.customer);
    setUseCaseName(c.useCase);
    setIsPreloaded(true);
    setPreloadedHeadlines(c.headlines);
    setRationale(c.rationale || null);
    setStage('results');
  };

  const restart = () => {
    setStage('landing');
    setScores({});
    setCustomerName('');
    setUseCaseName('');
    setIsPreloaded(false);
    setPreloadedHeadlines(null);
    setRationale(null);
  };

  const handleExport = () => {
    exportPpt(scores, customerName, useCaseName, isPreloaded, preloadedHeadlines, rationale);
  };

  return (
    <div className="app">
      <div className="topbar">
        <Logo />
        <div className="topbar-right">
          <span className="pill">AI Use Case Prioritiser · Concept</span>
        </div>
      </div>

      {stage === 'landing' && <Landing onStartBlank={startBlank} onLoadCase={loadCase} />}
      {stage === 'assess' && (
        <Assessment
          scores={scores}
          setScores={setScores}
          onComplete={() => setStage('results')}
          onBack={restart}
          customerName={customerName}
          setCustomerName={setCustomerName}
          useCaseName={useCaseName}
          setUseCaseName={setUseCaseName}
        />
      )}
      {stage === 'results' && (
        <Results
          scores={scores}
          customerName={customerName}
          useCaseName={useCaseName}
          onRestart={restart}
          onExport={handleExport}
          isPreloaded={isPreloaded}
          preloadedHeadlines={preloadedHeadlines}
          rationale={rationale}
        />
      )}

      <div className="footer-bar">
        <div>© 2026 · A concept built for Simpson Associates by Luke Craven</div>
        <div className="badge-row">
          <span>Inspired by Zygens DDAD · Simplified for Presales</span>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
