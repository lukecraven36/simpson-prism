<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Use Case Prioritiser | Simpson Associates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/gitbrent/PptxGenJS@v3.12.0/dist/pptxgen.bundle.js"></script>
<style>
  :root {
    --sa-navy: #0F2D52;
    --sa-navy-deep: #081A33;
    --sa-teal: #00B0B9;
    --sa-teal-deep: #008B92;
    --sa-green: #6FCF73;
    --sa-coral: #FF6B5B;
    --sa-amber: #F4B73E;
    --sa-cream: #F7F5EF;
    --sa-paper: #FAFAF7;
    --sa-ink: #0B1726;
    --sa-mute: #5A6573;
    --sa-line: #E3E1D8;
    --shadow-soft: 0 1px 2px rgba(11,23,38,0.04), 0 8px 24px rgba(11,23,38,0.06);
    --shadow-lift: 0 4px 12px rgba(11,23,38,0.08), 0 24px 48px rgba(11,23,38,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { font-family: 'Manrope', system-ui, sans-serif; background: var(--sa-paper); color: var(--sa-ink); -webkit-font-smoothing: antialiased; }
  #root { min-height: 100vh; }

  /* Hex motif background — subtle */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      radial-gradient(circle at 10% 5%, rgba(0,176,185,0.04) 0, transparent 35%),
      radial-gradient(circle at 90% 90%, rgba(15,45,82,0.04) 0, transparent 40%);
    pointer-events: none;
    z-index: 0;
  }

  .app { position: relative; z-index: 1; }

  /* Header */
  .topbar {
    background: var(--sa-navy);
    color: white;
    padding: 18px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 3px solid var(--sa-teal);
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-mark {
    width: 38px; height: 44px;
    display: grid; place-items: center;
    position: relative;
  }
  .brand-mark svg { width: 100%; height: 100%; }
  .brand-text { display: flex; flex-direction: column; line-height: 1.05; }
  .brand-text .sa { font-weight: 800; font-size: 18px; letter-spacing: 0.5px; }
  .brand-text .sub { font-size: 11px; color: rgba(255,255,255,0.65); letter-spacing: 1.2px; text-transform: uppercase; font-weight: 500; }
  .topbar-right { display: flex; align-items: center; gap: 20px; font-size: 13px; color: rgba(255,255,255,0.75); }
  .pill { background: rgba(0,176,185,0.18); color: var(--sa-teal); padding: 5px 12px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; border: 1px solid rgba(0,176,185,0.35); }

  /* Page */
  .page { max-width: 1180px; margin: 0 auto; padding: 48px 40px 80px; }

  /* Landing */
  .hero {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 60px;
    align-items: center;
    margin-bottom: 60px;
  }
  .eyebrow { color: var(--sa-teal-deep); font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 16px; }
  h1 {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 52px;
    font-weight: 400;
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: var(--sa-navy);
    margin-bottom: 20px;
  }
  h1 em { font-style: italic; color: var(--sa-teal-deep); }
  .lede { font-size: 18px; line-height: 1.55; color: var(--sa-mute); max-width: 520px; margin-bottom: 32px; }
  .cta-row { display: flex; gap: 14px; flex-wrap: wrap; }
  .btn {
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    padding: 14px 26px;
    border-radius: 6px;
    transition: all 0.18s ease;
    letter-spacing: 0.2px;
  }
  .btn-primary {
    background: var(--sa-navy);
    color: white;
  }
  .btn-primary:hover { background: var(--sa-navy-deep); transform: translateY(-1px); }
  .btn-secondary {
    background: white;
    color: var(--sa-navy);
    border: 1.5px solid var(--sa-navy);
  }
  .btn-secondary:hover { background: var(--sa-navy); color: white; }
  .btn-ghost {
    background: transparent;
    color: var(--sa-navy);
    text-decoration: underline;
    text-underline-offset: 4px;
    padding: 14px 8px;
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Hex visual on right */
  .hex-stack {
    position: relative;
    height: 440px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hex {
    position: absolute;
    width: 140px; height: 161px;
    display: grid; place-items: center;
    color: white;
    font-weight: 700;
    text-align: center;
    padding: 0 16px;
    line-height: 1.2;
  }
  .hex svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hex span { position: relative; z-index: 1; font-size: 13px; letter-spacing: 0.5px; text-transform: uppercase; }
  .hex.value { background: transparent; left: 35%; top: 20%; }
  .hex.value svg path { fill: var(--sa-teal); }
  .hex.risk { left: 55%; top: 40%; }
  .hex.risk svg path { fill: var(--sa-navy); }
  .hex.readiness { left: 40%; top: 60%; }
  .hex.readiness svg path { fill: var(--sa-green); }

  /* Cards row */
  .three-up { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 16px; }
  .card {
    background: white;
    border: 1px solid var(--sa-line);
    border-radius: 8px;
    padding: 26px 24px;
    box-shadow: var(--shadow-soft);
    position: relative;
    overflow: hidden;
  }
  .card .stripe {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--sa-teal);
  }
  .card.value .stripe { background: var(--sa-teal); }
  .card.risk .stripe { background: var(--sa-navy); }
  .card.readiness .stripe { background: var(--sa-green); }
  .card.timeframe .stripe { background: var(--sa-amber); }
  .card-num { font-family: 'Source Serif 4', serif; font-size: 36px; font-weight: 300; color: var(--sa-navy); margin-bottom: 4px; line-height: 1; font-style: italic; }
  .card h3 { font-size: 17px; font-weight: 700; color: var(--sa-navy); margin-bottom: 8px; letter-spacing: -0.2px; }
  .card p { font-size: 14px; color: var(--sa-mute); line-height: 1.55; }

  /* Customer chooser */
  .examples-section { margin-top: 64px; padding-top: 48px; border-top: 1px solid var(--sa-line); }
  .examples-section h2 { font-family: 'Source Serif 4', serif; font-size: 28px; font-weight: 400; color: var(--sa-navy); margin-bottom: 8px; letter-spacing: -0.01em; }
  .examples-section p.lead { color: var(--sa-mute); font-size: 15px; margin-bottom: 24px; }
  .case-card {
    background: white;
    border: 1px solid var(--sa-line);
    border-radius: 8px;
    padding: 24px;
    cursor: pointer;
    transition: all 0.18s ease;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .case-card:hover { border-color: var(--sa-teal); box-shadow: var(--shadow-lift); transform: translateY(-2px); }
  .case-sector { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--sa-teal-deep); font-weight: 700; }
  .case-card h4 { font-size: 17px; color: var(--sa-navy); font-weight: 700; line-height: 1.25; }
  .case-card p { font-size: 13px; color: var(--sa-mute); line-height: 1.55; }
  .case-stats { display: flex; gap: 12px; margin-top: 6px; }
  .case-stat { background: var(--sa-cream); padding: 6px 10px; border-radius: 4px; font-size: 11px; color: var(--sa-navy); font-weight: 600; }

  /* Assessment screen */
  .assess-wrap { max-width: 880px; margin: 0 auto; }
  .progress-bar { display: flex; gap: 6px; margin-bottom: 32px; }
  .progress-seg {
    flex: 1;
    height: 6px;
    border-radius: 3px;
    background: var(--sa-line);
    transition: background 0.25s ease;
  }
  .progress-seg.done { background: var(--sa-teal); }
  .progress-seg.current { background: var(--sa-navy); }

  .dimension-badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .dimension-badge.value { background: rgba(0,176,185,0.12); color: var(--sa-teal-deep); }
  .dimension-badge.risk { background: rgba(15,45,82,0.08); color: var(--sa-navy); }
  .dimension-badge.readiness { background: rgba(111,207,115,0.18); color: #2E7A3A; }
  .dimension-badge.timeframe { background: rgba(244,183,62,0.18); color: #8B6913; }
  .dimension-badge::before {
    content: ''; width: 8px; height: 8px; border-radius: 50%;
  }
  .dimension-badge.value::before { background: var(--sa-teal); }
  .dimension-badge.risk::before { background: var(--sa-navy); }
  .dimension-badge.readiness::before { background: var(--sa-green); }
  .dimension-badge.timeframe::before { background: var(--sa-amber); }

  .question-text {
    font-family: 'Source Serif 4', serif;
    font-size: 30px;
    font-weight: 400;
    line-height: 1.25;
    color: var(--sa-navy);
    margin-bottom: 12px;
    letter-spacing: -0.01em;
  }
  .question-context { color: var(--sa-mute); font-size: 15px; line-height: 1.55; margin-bottom: 32px; max-width: 700px; }
  .q-counter { font-size: 12px; color: var(--sa-mute); letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; margin-bottom: 14px; }

  .scale {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 36px;
  }
  .scale-option {
    background: white;
    border: 1.5px solid var(--sa-line);
    border-radius: 8px;
    padding: 18px 14px;
    cursor: pointer;
    transition: all 0.16s ease;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 130px;
  }
  .scale-option:hover { border-color: var(--sa-teal); transform: translateY(-2px); box-shadow: var(--shadow-soft); }
  .scale-option.selected {
    border-color: var(--sa-navy);
    background: var(--sa-navy);
    color: white;
  }
  .scale-option .num {
    font-family: 'Source Serif 4', serif;
    font-size: 30px;
    font-weight: 300;
    font-style: italic;
    line-height: 1;
  }
  .scale-option.selected .num { color: var(--sa-teal); }
  .scale-option .lbl { font-size: 12px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; }
  .scale-option .desc { font-size: 11px; line-height: 1.45; opacity: 0.85; flex: 1; }

  .nav-row { display: flex; justify-content: space-between; align-items: center; }
  .skip-link { color: var(--sa-mute); font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; }
  .skip-link:hover { color: var(--sa-navy); }

  /* Results */
  .results-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 40px; align-items: start; margin-bottom: 40px; }
  .verdict-card { background: var(--sa-navy); color: white; border-radius: 10px; padding: 36px; position: relative; overflow: hidden; }
  .verdict-card::after {
    content: '';
    position: absolute;
    right: -40px; bottom: -40px;
    width: 220px; height: 220px;
    background: radial-gradient(circle, rgba(0,176,185,0.25) 0, transparent 65%);
    pointer-events: none;
  }
  .verdict-eyebrow { color: var(--sa-teal); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; margin-bottom: 14px; }
  .verdict-card h2 { font-family: 'Source Serif 4', serif; font-size: 36px; font-weight: 400; line-height: 1.15; margin-bottom: 14px; letter-spacing: -0.01em; }
  .verdict-card p { color: rgba(255,255,255,0.78); font-size: 15px; line-height: 1.55; margin-bottom: 22px; }
  .verdict-recommendation {
    background: rgba(255,255,255,0.08);
    border-left: 3px solid var(--sa-teal);
    padding: 14px 18px;
    border-radius: 4px;
    font-size: 14px;
    line-height: 1.55;
  }

  .scores-list { display: flex; flex-direction: column; gap: 16px; }
  .score-row {
    background: white;
    border: 1px solid var(--sa-line);
    border-radius: 8px;
    padding: 18px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: all 0.18s ease;
  }
  .score-row:hover { border-color: var(--sa-teal); transform: translateY(-1px); box-shadow: var(--shadow-soft); }
  .score-row.expanded { border-color: var(--sa-navy); }
  .score-row-left { flex: 1; }
  .score-row-label-row { display: flex; align-items: center; gap: 8px; }
  .score-row-chevron { color: var(--sa-mute); font-size: 12px; transition: transform 0.2s ease; }
  .score-row.expanded .score-row-chevron { transform: rotate(90deg); color: var(--sa-teal-deep); }
  .score-row-label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; margin-bottom: 6px; }
  .score-row.value .score-row-label { color: var(--sa-teal-deep); }
  .score-row.risk .score-row-label { color: var(--sa-navy); }
  .score-row.readiness .score-row-label { color: #2E7A3A; }
  .score-row.timeframe .score-row-label { color: #8B6913; }
  .score-row-meter { height: 6px; background: var(--sa-cream); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .score-row-fill { height: 100%; border-radius: 3px; transition: width 0.6s cubic-bezier(.2,.8,.2,1); }
  .score-row.value .score-row-fill { background: var(--sa-teal); }
  .score-row.risk .score-row-fill { background: var(--sa-navy); }
  .score-row.readiness .score-row-fill { background: var(--sa-green); }
  .score-row.timeframe .score-row-fill { background: var(--sa-amber); }
  .score-row-value { font-family: 'Source Serif 4', serif; font-size: 38px; font-weight: 300; font-style: italic; color: var(--sa-navy); line-height: 1; margin-left: 22px; }
  .score-row-value small { font-size: 14px; color: var(--sa-mute); font-style: normal; font-family: 'Manrope', sans-serif; }

  /* Detail panel */
  .detail-panel {
    background: white;
    border: 1px solid var(--sa-line);
    border-radius: 10px;
    padding: 28px;
    margin-bottom: 24px;
  }
  .detail-panel h4 {
    font-family: 'Source Serif 4', serif;
    font-size: 22px;
    font-weight: 400;
    color: var(--sa-navy);
    margin-bottom: 4px;
    letter-spacing: -0.01em;
  }
  .detail-panel .detail-sub {
    color: var(--sa-mute);
    font-size: 13px;
    margin-bottom: 22px;
  }
  .detail-row {
    display: flex;
    gap: 16px;
    padding: 16px 0;
    border-bottom: 1px solid var(--sa-line);
    align-items: flex-start;
  }
  .detail-row:last-child { border-bottom: 0; }
  .detail-score-pill {
    flex-shrink: 0;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--sa-cream);
    display: grid;
    place-items: center;
    font-family: 'Source Serif 4', serif;
    font-size: 26px;
    font-style: italic;
    font-weight: 300;
    color: var(--sa-navy);
    border: 2px solid var(--sa-line);
  }
  .detail-panel.value .detail-score-pill { background: rgba(0,176,185,0.10); border-color: rgba(0,176,185,0.3); }
  .detail-panel.risk .detail-score-pill { background: rgba(15,45,82,0.08); border-color: rgba(15,45,82,0.2); }
  .detail-panel.readiness .detail-score-pill { background: rgba(111,207,115,0.18); border-color: rgba(111,207,115,0.4); }
  .detail-panel.timeframe .detail-score-pill { background: rgba(244,183,62,0.18); border-color: rgba(244,183,62,0.4); }
  .detail-q-text {
    font-size: 14px;
    font-weight: 700;
    color: var(--sa-navy);
    margin-bottom: 4px;
    line-height: 1.4;
  }
  .detail-q-answer {
    font-size: 13px;
    color: var(--sa-mute);
    margin-bottom: 8px;
  }
  .detail-q-answer strong { color: var(--sa-ink); }
  .detail-q-rationale {
    font-size: 13px;
    line-height: 1.55;
    color: var(--sa-ink);
    font-style: italic;
    background: var(--sa-cream);
    padding: 10px 14px;
    border-left: 3px solid var(--sa-teal);
    border-radius: 4px;
  }
  .detail-q-rationale-empty {
    font-size: 12px;
    color: var(--sa-mute);
    font-style: italic;
  }

  /* Matrix */
  .matrix-section { background: white; border: 1px solid var(--sa-line); border-radius: 10px; padding: 32px; margin-bottom: 32px; }
  .matrix-section h3 { font-family: 'Source Serif 4', serif; font-size: 22px; font-weight: 400; color: var(--sa-navy); margin-bottom: 6px; letter-spacing: -0.01em; }
  .matrix-section .sub { color: var(--sa-mute); font-size: 13px; margin-bottom: 24px; }
  .matrix-axis-picker {
    display: flex; gap: 16px; flex-wrap: wrap;
    margin: 0 0 24px;
    padding: 14px 18px;
    background: var(--sa-cream);
    border-radius: 8px;
    align-items: center;
  }
  .matrix-axis-picker .picker-group { display: flex; align-items: center; gap: 8px; }
  .matrix-axis-picker label {
    font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--sa-mute); font-weight: 700;
  }
  .matrix-axis-picker select {
    border: 1px solid var(--sa-line);
    background: white;
    border-radius: 6px;
    padding: 7px 10px;
    font-family: inherit;
    font-size: 13px;
    color: var(--sa-navy);
    font-weight: 600;
    cursor: pointer;
  }
  .matrix-axis-picker select:focus { outline: none; border-color: var(--sa-teal); }
  .matrix-wrap {
    position: relative;
    height: 480px;
    padding: 20px 30px 50px 80px;
  }
  .matrix-grid {
    position: relative;
    height: 100%;
    width: 100%;
    border-left: 2px solid var(--sa-line);
    border-bottom: 2px solid var(--sa-line);
  }
  .matrix-quadrant {
    position: absolute;
    width: 50%;
    height: 50%;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 14px 18px;
  }
  .matrix-quadrant.tl { top: 0; left: 0; background: rgba(0,176,185,0.04); }
  .matrix-quadrant.tr { top: 0; right: 0; background: rgba(0,176,185,0.10); }
  .matrix-quadrant.bl { bottom: 0; left: 0; background: rgba(90,101,115,0.04); }
  .matrix-quadrant.br { bottom: 0; right: 0; background: rgba(244,183,62,0.08); }
  .matrix-quad-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--sa-mute); font-weight: 700; }
  .matrix-quad-title { font-size: 14px; font-weight: 700; color: var(--sa-navy); margin-top: 4px; }
  .matrix-quadrant.tr .matrix-quad-label { color: var(--sa-teal-deep); }

  /* Y axis label using writing-mode for clean vertical text */
  .matrix-ylabel {
    position: absolute;
    left: 15px;
    top: 0;
    bottom: 50px;
    width: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    writing-mode: vertical-rl;
    color: var(--sa-mute);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 700;
    pointer-events: none;
  }
  .matrix-xlabel {
    position: absolute;
    bottom: 16px;
    left: 80px;
    right: 30px;
    text-align: center;
    color: var(--sa-mute);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 700;
    pointer-events: none;
  }

  .matrix-point {
    position: absolute;
    border-radius: 50%;
    background: var(--sa-navy);
    color: white;
    display: grid; place-items: center;
    font-weight: 700;
    font-size: 13px;
    transform: translate(-50%, 50%);
    box-shadow: 0 4px 16px rgba(15,45,82,0.35);
    border: 3px solid white;
    cursor: pointer;
    transition: transform 0.2s ease;
    z-index: 2;
  }
  .matrix-point:hover { transform: translate(-50%, 50%) scale(1.08); }
  .matrix-point-label {
    position: absolute;
    bottom: calc(100% + 10px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--sa-navy);
    color: white;
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
    letter-spacing: 0.3px;
    box-shadow: 0 4px 12px rgba(15,45,82,0.2);
  }
  .matrix-point-label::after {
    content: ''; position: absolute;
    top: 100%; left: 50%; transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: var(--sa-navy);
  }

function Assessment({ scores, setScores, onComplete, onBack, customerName, setCustomerName, useCaseName, setUseCaseName }) {
  const [idx, setIdx] = useState(0);
  const [stage, setStage] = useState(customerName ? 'questions' : 'meta'); // 'meta' or 'questions'

  const total = FLAT_QUESTIONS.length;
  const q = FLAT_QUESTIONS[idx];
  const currentScore = q ? scores[q.id] : null;

  const select = (v) => {
    setScores(s => ({ ...s, [q.id]: v }));
    setTimeout(() => {
      if (idx < total - 1) setIdx(idx + 1);
      else onComplete();
    }, 220);
  };

  const back = () => setIdx(Math.max(0, idx - 1));
  const skip = () => {

  if (stage === 'meta') {
    return (

function avg(scores, ids) {
  const vals = ids.map(id => scores[id]).filter(v => typeof v === 'number');
  if (!vals.length) return 0;
  return vals.reduce((a,b) => a+b, 0) / vals.length;
}

function getVerdict(value, risk, readiness, timeframe) {
  const tf = typeof timeframe === 'number' ? timeframe : 3; // default if not provided

  if (value >= 3.5 && risk <= 3 && readiness >= 3.5 && tf >= 3.5) {
    return {
      title: 'Lighthouse — start now.',
      summary: 'High value, manageable risk, strong readiness, and a realistic timeframe. This is the use case to fund, sponsor and turn into a story.',
      recommendation: 'Recommend a 6–8 week Proof of Value engagement. Embed responsible-AI guardrails from day one. Position as a sector lighthouse so the success unlocks the wider portfolio.',
    };
  }
  if (value >= 3.5 && risk <= 3 && readiness >= 3.5 && tf < 3.5) {
    return {
      title: 'A lighthouse — but expect a longer runway.',
      summary: 'The use case is genuinely strong, but the effort and time to deliver are material. Worth backing, but with eyes on the runway.',
      recommendation: 'Run a 4-week shaping engagement to lock down architecture, integration and licensing before committing to a Proof of Value. Don\'t let the long runway erode the business case — sequence the work so value emerges in stages.',
    };
  }
  if (value >= 3.5 && risk >= 3.5) {
    return {
      title: 'High reward, but eyes wide open.',
      summary: 'Real value sits inside this use case — but so does material risk. Treat as strategic, not a quick win.',
      recommendation: 'Begin with an AI Readiness Assessment and a focused Responsible AI design phase. Engage the Ethics & Risk Review Board early. Structure delivery in phased gates with human-in-the-loop by default.',
    };
  }
  if (value >= 3.5 && readiness < 3) {
    return {
      title: 'Valuable, but not yet deliverable.',
      summary: 'The prize is real, but the organisation isn\'t ready to capture it today.',
      recommendation: 'Park as a target use case. Use this assessment to define the foundation work needed — data, platform, sponsorship, governance — and revisit in 3–6 months.',
    };
  }
  if (value < 2.5 && risk < 2.5) {
    return {
      title: 'Quick win — useful, but not the headline.',
      summary: 'Low-risk and easy to deliver. Worth doing for productivity, but unlikely to be the case study Simpson builds the year around.',
      recommendation: 'Deliver as a packaged productivity engagement. Use it to demonstrate momentum while higher-value use cases mature.',
    };
  }
  return {
    title: 'Worth a closer conversation.',
    summary: 'The numbers don\'t scream "go" or "park" — which usually means the next step is shaping, not scoring.',
    recommendation: 'Run a focused half-day workshop with the use case sponsor to sharpen scope, sharpen the value hypothesis and decide whether to invest in a Proof of Value.',
  };
}

  const timeframeScore = avg(scores, QUESTIONS.timeframe.map(q => q.id));

  const verdict = getVerdict(valueScore, riskScore, readinessScore, timeframeScore);

  const xPct = pctFor(xAxis);

  const bubbleSize = 36 + (readinessScore / 5) * 36; // still sized by readiness for visual cue

  return (

          <button className="activate-cta" onClick={onActivateAgent}>⚡ Activate Fabric Agent →</button>
        </div>
      </div>

      <div className="results-grid">
        <div className="verdict-card">
          <div className="verdict-eyebrow">The Verdict</div>
          <h2>{verdict.title}</h2>
          <p>{verdict.summary}</p>
          <div className="verdict-recommendation">
            <strong style={{ color: 'var(--sa-teal)', display: 'block', marginBottom: 6, fontSize: 11, letterSpacing: 1.5, textTransform: 'uppercase' }}>Recommended Next Step</strong>
            {verdict.recommendation}
          </div>
        </div>

        <div className="scores-list">
          {[
            { dim: 'value', label: 'Value', score: valueScore, max: 5, hint: 'Click to see how this score is built' },
            { dim: 'risk', label: 'Risk', score: riskScore, max: 5, hint: 'Click to see how this score is built' },
            { dim: 'readiness', label: 'Readiness', score: readinessScore, max: 5, hint: 'Click to see how this score is built' },
            { dim: 'timeframe', label: 'Timeframe', score: timeframeScore, max: 5, hint: 'Click to see how this score is built' },
          ].map(s => (
            <div
              key={s.dim}
              className={`score-row ${s.dim} ${expandedDim === s.dim ? 'expanded' : ''}`}
              onClick={() => setExpandedDim(expandedDim === s.dim ? null : s.dim)}
            >
              <div className="score-row-left">
                <div className="score-row-label-row">
                  <div className="score-row-label">{s.label}</div>
                  <span className="score-row-chevron">▸</span>
                </div>
                <div className="score-row-meter">
                  <div className="score-row-fill" style={{ width: `${(s.score/s.max)*100}%` }} />
                </div>
              </div>
              <div className="score-row-value">{s.score.toFixed(1)}<small>/5</small></div>
            </div>
          ))}
        </div>
      </div>

      {expandedDim && (
        <div className={`detail-panel ${expandedDim}`}>
          <h4>{
            expandedDim === 'value' ? 'How the Value score is built'
            : expandedDim === 'risk' ? 'How the Risk score is built'
            : expandedDim === 'readiness' ? 'How the Readiness score is built'
            : 'How the Timeframe score is built'
          }</h4>
          <p className="detail-sub">
            {expandedDim === 'value' && 'Five questions on reach, time, outcomes, financial impact and visibility.'}
            {expandedDim === 'risk' && 'Five questions on data sensitivity, autonomy, regulation, failure impact and workforce reception.'}
            {expandedDim === 'readiness' && 'Five questions on data, platform, sponsorship, governance and time-to-start.'}
            {expandedDim === 'timeframe' && 'Five questions on internal expertise, data engineering effort, integration complexity, decision-making speed and known blockers.'}
          </p>

          {QUESTIONS[expandedDim].map(q => {
            const answer = scores[q.id];
            const opt = q.scale.find(o => o.v === answer);
            const note = rationale && rationale[q.id];
            return (
              <div key={q.id} className="detail-row">
                <div className="detail-score-pill">{answer || '—'}</div>
                <div style={{ flex: 1 }}>
                  <div className="detail-q-text">{q.text}</div>
                  {opt && (
                    <div className="detail-q-answer">
                      Answer: <strong>{opt.label}</strong> — {opt.desc}
                    </div>
                  )}
                  {note ? (
                    <div className="detail-q-rationale">"{note}"</div>
                  ) : (
                    <div className="detail-q-rationale-empty">No rationale captured for this question.</div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}

      <div className="matrix-section">
        <h3>Prioritisation Matrix</h3>
        <p className="sub">Pick any two of the four PRISM dimensions to plot the use case against. Bubble size still reflects Readiness.</p>

        <div className="matrix-axis-picker">
          <div className="picker-group">
            <label>X axis</label>
            <select value={xAxis} onChange={(e) => setXAxis(e.target.value)}>
              <option value="value">Value</option>
              <option value="risk">Risk</option>
              <option value="readiness">Readiness</option>
              <option value="timeframe">Timeframe</option>
            </select>
          </div>
          <div className="picker-group">
            <label>Y axis</label>
            <select value={yAxis} onChange={(e) => setYAxis(e.target.value)}>
              <option value="value">Value</option>
              <option value="risk">Risk</option>
              <option value="readiness">Readiness</option>
              <option value="timeframe">Timeframe</option>
            </select>
          </div>
          {xAxis === yAxis && (
            <span style={{ fontSize: 12, color: 'var(--sa-coral)', fontWeight: 600 }}>
              Pick two different dimensions for the plot to make sense.
            </span>
          )}
        </div>

        <div className="matrix-wrap">
          <span className="matrix-ylabel">
            {isInverted(yAxis)
              ? `Lower ${axisLabels[yAxis].toLowerCase()} · ↑ · Higher ${axisLabels[yAxis].toLowerCase()}`
              : `Higher ${axisLabels[yAxis].toLowerCase()} · ↑ · Lower ${axisLabels[yAxis].toLowerCase()}`}
          </span>
          <span className="matrix-xlabel">
            {isInverted(xAxis)
              ? `→ Lower ${axisLabels[xAxis].toLowerCase()} · Higher ${axisLabels[xAxis].toLowerCase()} ←`
              : `← Lower ${axisLabels[xAxis].toLowerCase()} · Higher ${axisLabels[xAxis].toLowerCase()} →`}
          </span>

          <div className="matrix-grid">
            <div className="matrix-quadrant tl">
              <div className="matrix-quad-label">{axisLabels[yAxis]} high · {axisLabels[xAxis]} low</div>
            </div>
            <div className="matrix-quadrant tr">
              <div className="matrix-quad-label">★ The sweet spot</div>
              <div className="matrix-quad-title">{axisLabels[xAxis]} & {axisLabels[yAxis]} both favourable</div>
            </div>
            <div className="matrix-quadrant bl">
              <div className="matrix-quad-label">Both low — park</div>
            </div>
            <div className="matrix-quadrant br">
              <div className="matrix-quad-label">{axisLabels[xAxis]} high · {axisLabels[yAxis]} low</div>
            </div>

            {xAxis !== yAxis && (
              <div
                className="matrix-point"
                style={{
                  left: `${Math.min(95, Math.max(5, xPct))}%`,
                  bottom: `${Math.min(95, Math.max(5, yPct))}%`,
                  width: bubbleSize,
                  height: bubbleSize,
                  fontSize: bubbleSize < 50 ? 11 : 13,
                }}
                title={`${axisLabels[xAxis]} ${allScores[xAxis].toFixed(1)} · ${axisLabels[yAxis]} ${allScores[yAxis].toFixed(1)} · Readiness ${readinessScore.toFixed(1)}`}
              >
                <div className="matrix-point-label">{customerName} · {readinessScore.toFixed(1)} ready</div>
                {allScores[xAxis].toFixed(1)}
              </div>
            )}
          </div>
        </div>

        <p style={{ fontSize: 12, color: 'var(--sa-mute)', marginTop: 20, lineHeight: 1.55 }}>
          <strong style={{ color: 'var(--sa-navy)' }}>Reading the chart:</strong>{' '}
          The top-right quadrant is where you want use cases to land — the bubble size shows how ready the organisation is to deliver today (larger = more ready). Note that for Risk, lower is better, so the axis is inverted automatically.
        </p>
      </div>

      {isPreloaded && preloadedHeadlines && (
        <div className="matrix-section" style={{ background: 'var(--sa-cream)', borderColor: 'var(--sa-line)' }}>
          <h3>What actually happened</h3>
          <p className="sub">The real-world outcomes from this Simpson Associates engagement.</p>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 20, marginTop: 14 }}>
            {preloadedHeadlines.map((h, i) => (
              <div key={i}>
                <div style={{
                  fontFamily: 'Source Serif 4, serif',
                  fontSize: 48, fontWeight: 300, fontStyle: 'italic',
                  color: 'var(--sa-navy)', lineHeight: 1, marginBottom: 8,
                }}>{h.stat}</div>
                <div style={{ fontSize: 13, color: 'var(--sa-mute)', lineHeight: 1.5 }}>{h.label}</div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ============================================================
// PPTX EXPORT
// ============================================================
function exportPpt(scores, customerName, useCaseName, isPreloaded, preloadedHeadlines, rationale) {
  const pptx = new PptxGenJS();
  pptx.title = `${customerName} — AI Use Case Assessment`;
  pptx.author = 'Simpson Associates';
  pptx.layout = 'LAYOUT_WIDE'; // 13.3 x 7.5

  const NAVY = '0F2D52';
  const TEAL = '00B0B9';
  const GREEN = '6FCF73';
  const AMBER = 'F4B73E';
  const CREAM = 'F7F5EF';
  const MUTE = '5A6573';
  const PAPER = 'FAFAF7';
  const INK = '0B1726';

  const valueScore = avg(scores, QUESTIONS.value.map(q => q.id));
  const riskScore = avg(scores, QUESTIONS.risk.map(q => q.id));
  const readinessScore = avg(scores, QUESTIONS.readiness.map(q => q.id));
  const timeframeScore = avg(scores, QUESTIONS.timeframe.map(q => q.id));
  const verdict = getVerdict(valueScore, riskScore, readinessScore, timeframeScore);

  // ---------- SLIDE 1: COVER ----------
  const s1 = pptx.addSlide();
  s1.background = { color: NAVY };

  // Hex motif
  s1.addShape(pptx.ShapeType.hexagon, { x: 10.5, y: 0.4, w: 1.6, h: 1.8, fill: { color: TEAL }, line: { color: TEAL } });
  s1.addText('S', { x: 10.5, y: 0.4, w: 1.6, h: 1.8, color: 'FFFFFF', fontFace: 'Calibri', fontSize: 64, bold: true, align: 'center', valign: 'middle' });

  s1.addText('Simpson Associates · AI Use Case Prioritiser', { x: 0.6, y: 0.55, w: 8, h: 0.4, fontSize: 11, color: TEAL, fontFace: 'Calibri', bold: true, charSpacing: 3 });

  s1.addText(customerName, { x: 0.6, y: 1.5, w: 11, h: 0.7, fontSize: 22, color: 'FFFFFF', fontFace: 'Calibri', bold: true, charSpacing: 1 });
  s1.addText(useCaseName, { x: 0.6, y: 2.3, w: 11, h: 1.8, fontSize: 44, color: 'FFFFFF', fontFace: 'Georgia', italic: false });

  // Four-up summary chips
  const chipY = 5.6;
  [
    { label: 'VALUE', score: valueScore, colour: TEAL },
    { label: 'RISK', score: riskScore, colour: 'FFFFFF' },
    { label: 'READINESS', score: readinessScore, colour: GREEN },
    { label: 'TIMEFRAME', score: timeframeScore, colour: AMBER },
  ].forEach((c, i) => {
    const x = 0.6 + i * 3.05;
    s1.addShape(pptx.ShapeType.rect, { x, y: chipY, w: 2.85, h: 1.3, fill: { color: '081A33' }, line: { color: c.colour, width: 1 } });
    s1.addText(c.label, { x: x + 0.2, y: chipY + 0.15, w: 2.55, h: 0.3, fontSize: 10, color: c.colour, fontFace: 'Calibri', bold: true, charSpacing: 3 });
    s1.addText(`${c.score.toFixed(1)}`, { x: x + 0.2, y: chipY + 0.4, w: 2.55, h: 0.9, fontSize: 44, color: 'FFFFFF', fontFace: 'Georgia', italic: true });
    s1.addText('/ 5', { x: x + 1.4, y: chipY + 0.7, w: 1, h: 0.5, fontSize: 14, color: MUTE, fontFace: 'Calibri' });
  });

  s1.addText('A simple way to score AI use cases on value, risk, readiness and timeframe — built for purpose-led organisations.', { x: 0.6, y: 6.95, w: 11, h: 0.4, fontSize: 11, color: 'AAB4C2', fontFace: 'Calibri', italic: true });

  // ---------- SLIDE 2: THE VERDICT ----------
  const s2 = pptx.addSlide();
  s2.background = { color: PAPER };

  s2.addText('THE VERDICT', { x: 0.6, y: 0.5, w: 10, h: 0.35, fontSize: 11, color: TEAL, fontFace: 'Calibri', bold: true, charSpacing: 3 });
  s2.addText(customerName + ' · ' + useCaseName, { x: 0.6, y: 0.85, w: 12, h: 0.35, fontSize: 13, color: MUTE, fontFace: 'Calibri' });

  s2.addText(verdict.title, { x: 0.6, y: 1.4, w: 12, h: 1.2, fontSize: 38, color: NAVY, fontFace: 'Georgia' });
  s2.addText(verdict.summary, { x: 0.6, y: 2.8, w: 12, h: 0.9, fontSize: 16, color: INK, fontFace: 'Calibri', italic: false });

  // Recommendation block
  s2.addShape(pptx.ShapeType.rect, { x: 0.6, y: 4.0, w: 12.1, h: 1.6, fill: { color: NAVY }, line: { color: NAVY } });
  s2.addShape(pptx.ShapeType.rect, { x: 0.6, y: 4.0, w: 0.08, h: 1.6, fill: { color: TEAL }, line: { color: TEAL } });
  s2.addText('RECOMMENDED NEXT STEP', { x: 0.85, y: 4.15, w: 8, h: 0.3, fontSize: 10, color: TEAL, fontFace: 'Calibri', bold: true, charSpacing: 3 });
  s2.addText(verdict.recommendation, { x: 0.85, y: 4.5, w: 11.6, h: 1, fontSize: 14, color: 'FFFFFF', fontFace: 'Calibri', valign: 'top' });

  // Footer
  s2.addText('Simpson Associates · AI Use Case Prioritiser', { x: 0.6, y: 7.1, w: 8, h: 0.3, fontSize: 9, color: MUTE, fontFace: 'Calibri' });
  s2.addText('Page 2 of 5', { x: 11, y: 7.1, w: 1.7, h: 0.3, fontSize: 9, color: MUTE, fontFace: 'Calibri', align: 'right' });

  // ---------- SLIDE 3: SCORE BREAKDOWN ----------
  const s3 = pptx.addSlide();
  s3.background = { color: PAPER };

  s3.addText('SCORE BREAKDOWN', { x: 0.6, y: 0.5, w: 10, h: 0.35, fontSize: 11, color: TEAL, fontFace: 'Calibri', bold: true, charSpacing: 3 });
  s3.addText('Four dimensions, twenty questions', { x: 0.6, y: 0.85, w: 12, h: 0.6, fontSize: 28, color: NAVY, fontFace: 'Georgia' });

  // Four score cards
  const cardY = 1.9;
  const cardData = [
    { label: 'VALUE', score: valueScore, colour: TEAL, blurb: 'Reach, time saved, outcomes, financial impact and visibility.' },
    { label: 'RISK', score: riskScore, colour: NAVY, blurb: 'Data sensitivity, autonomy, regulation, failure impact and adoption.' },
    { label: 'READINESS', score: readinessScore, colour: GREEN, blurb: 'Data, platform, sponsorship, governance and realistic time-to-start.' },
    { label: 'TIMEFRAME', score: timeframeScore, colour: AMBER, blurb: 'Internal expertise, data engineering effort, integration, decision speed, blockers.' },
  ];
  cardData.forEach((c, i) => {
    const x = 0.6 + i * 3.05;
    s3.addShape(pptx.ShapeType.rect, { x, y: cardY, w: 2.85, h: 4.6, fill: { color: 'FFFFFF' }, line: { color: 'E3E1D8' } });
    s3.addShape(pptx.ShapeType.rect, { x, y: cardY, w: 2.85, h: 0.08, fill: { color: c.colour }, line: { color: c.colour } });
    s3.addText(c.label, { x: x + 0.25, y: cardY + 0.3, w: 2.4, h: 0.3, fontSize: 11, color: c.colour, fontFace: 'Calibri', bold: true, charSpacing: 3 });
    s3.addText(`${c.score.toFixed(1)}`, { x: x + 0.25, y: cardY + 0.8, w: 2.4, h: 1.6, fontSize: 72, color: NAVY, fontFace: 'Georgia', italic: true });
    s3.addText('/ 5', { x: x + 1.5, y: cardY + 1.55, w: 1.1, h: 0.5, fontSize: 16, color: MUTE, fontFace: 'Calibri' });

    // Mini-bar
    s3.addShape(pptx.ShapeType.rect, { x: x + 0.25, y: cardY + 2.6, w: 2.4, h: 0.18, fill: { color: CREAM }, line: { color: CREAM } });
    s3.addShape(pptx.ShapeType.rect, { x: x + 0.25, y: cardY + 2.6, w: 2.4 * (c.score / 5), h: 0.18, fill: { color: c.colour }, line: { color: c.colour } });

    s3.addText(c.blurb, { x: x + 0.25, y: cardY + 3.0, w: 2.4, h: 1.5, fontSize: 11, color: MUTE, fontFace: 'Calibri', valign: 'top' });
  });

  // Per-question detail
  s3.addText('Detail by question (1 lowest — 5 highest):', { x: 0.6, y: 6.7, w: 12, h: 0.3, fontSize: 10, color: MUTE, fontFace: 'Calibri', italic: true });

  // Footer
  s3.addText('Simpson Associates · AI Use Case Prioritiser', { x: 0.6, y: 7.1, w: 8, h: 0.3, fontSize: 9, color: MUTE, fontFace: 'Calibri' });
  s3.addText('Page 3 of 5', { x: 11, y: 7.1, w: 1.7, h: 0.3, fontSize: 9, color: MUTE, fontFace: 'Calibri', align: 'right' });

  // ---------- SLIDE 4: MATRIX ----------
  const s4 = pptx.addSlide();
  s4.background = { color: PAPER };

  s4.addText('VALUE vs RISK · sized by Readiness', { x: 0.6, y: 0.5, w: 10, h: 0.35, fontSize: 11, color: TEAL, fontFace: 'Calibri', bold: true, charSpacing: 3 });
  s4.addText('Where does this use case land on the prioritisation map?', { x: 0.6, y: 0.85, w: 12, h: 0.6, fontSize: 26, color: NAVY, fontFace: 'Georgia' });

  // Chart area
  const cx = 1.4, cy = 2.0, cw = 7, ch = 4.6;

  // Quadrants
  s4.addShape(pptx.ShapeType.rect, { x: cx, y: cy, w: cw/2, h: ch/2, fill: { color: 'F0F7F8' }, line: { color: 'E3E1D8' } });
  s4.addShape(pptx.ShapeType.rect, { x: cx + cw/2, y: cy, w: cw/2, h: ch/2, fill: { color: 'F5F1E5' }, line: { color: 'E3E1D8' } });
  s4.addShape(pptx.ShapeType.rect, { x: cx, y: cy + ch/2, w: cw/2, h: ch/2, fill: { color: 'F0EFEC' }, line: { color: 'E3E1D8' } });
  s4.addShape(pptx.ShapeType.rect, { x: cx + cw/2, y: cy + ch/2, w: cw/2, h: ch/2, fill: { color: 'F8EFEC' }, line: { color: 'E3E1D8' } });

  // Quadrant labels
  s4.addText('Strategic but\nspeculative', { x: cx + 0.15, y: cy + 0.15, w: cw/2 - 0.3, h: 0.6, fontSize: 10, color: MUTE, fontFace: 'Calibri', bold: true });
  s4.addText('LIGHTHOUSE\nUSE CASE', { x: cx + cw/2 + 0.15, y: cy + 0.15, w: cw/2 - 0.3, h: 0.6, fontSize: 11, color: TEAL, fontFace: 'Calibri', bold: true, charSpacing: 1 });
  s4.addText('Park or\ndescope', { x: cx + 0.15, y: cy + ch - 0.7, w: cw/2 - 0.3, h: 0.6, fontSize: 10, color: MUTE, fontFace: 'Calibri', bold: true });
  s4.addText('High reward,\neyes open', { x: cx + cw/2 + 0.15, y: cy + ch - 0.7, w: cw/2 - 0.3, h: 0.6, fontSize: 10, color: MUTE, fontFace: 'Calibri', bold: true });

  // Bubble position: x = value/5, y = (5-risk)/5 from TOP
  const bx = cx + (valueScore / 5) * cw;
  const by = cy + ((riskScore - 0) / 5) * ch; // risk from top — actually we want low risk near top
  // Recalc: y from top = (risk/5) * ch, so high risk = bottom. Wait we want low risk at top.
  // bottom = (5-risk)/5 means y from top = risk/5 * ch
  const byCorrect = cy + (riskScore / 5) * ch;
  const bubble = 0.4 + (readinessScore / 5) * 0.5; // 0.4 - 0.9 inches

  s4.addShape(pptx.ShapeType.ellipse, {
    x: bx - bubble/2,
    y: byCorrect - bubble/2,
    w: bubble,
    h: bubble,
    fill: { color: NAVY },
    line: { color: 'FFFFFF', width: 3 },
  });
  s4.addText(valueScore.toFixed(1), {
    x: bx - bubble/2,
    y: byCorrect - bubble/2,
    w: bubble,
    h: bubble,
    fontSize: bubble < 0.55 ? 10 : 13,
    color: 'FFFFFF',
    fontFace: 'Calibri',
    bold: true,
    align: 'center',
    valign: 'middle',
  });

  // Axes labels — properly placed
  s4.addText('← Lower value     ·     Higher value →', { x: cx, y: cy + ch + 0.1, w: cw, h: 0.3, fontSize: 10, color: MUTE, fontFace: 'Calibri', align: 'center', bold: true });

  // Y-axis labels — separate items, properly placed
  s4.addText('↑ Lower risk', { x: 0.3, y: cy + 0.2, w: 1.0, h: 0.4, fontSize: 9, color: MUTE, fontFace: 'Calibri', bold: true, align: 'left' });
  s4.addText('↓ Higher risk', { x: 0.3, y: cy + ch - 0.5, w: 1.0, h: 0.4, fontSize: 9, color: MUTE, fontFace: 'Calibri', bold: true, align: 'left' });

  // Side panel with the result
  const px = 9.2;
  s4.addShape(pptx.ShapeType.rect, { x: px, y: 2.0, w: 3.5, h: 4.6, fill: { color: 'FFFFFF' }, line: { color: 'E3E1D8' } });
  s4.addShape(pptx.ShapeType.rect, { x: px, y: 2.0, w: 0.08, h: 4.6, fill: { color: TEAL }, line: { color: TEAL } });
  s4.addText('THIS USE CASE', { x: px + 0.25, y: 2.2, w: 3.1, h: 0.3, fontSize: 10, color: TEAL, fontFace: 'Calibri', bold: true, charSpacing: 3 });
  s4.addText(customerName, { x: px + 0.25, y: 2.55, w: 3.1, h: 0.45, fontSize: 15, color: NAVY, fontFace: 'Calibri', bold: true });
  s4.addText(useCaseName, { x: px + 0.25, y: 3.05, w: 3.1, h: 1, fontSize: 12, color: INK, fontFace: 'Calibri', italic: true });

  s4.addText(`Value: ${valueScore.toFixed(1)} / 5`, { x: px + 0.25, y: 4.3, w: 3.1, h: 0.32, fontSize: 12, color: NAVY, fontFace: 'Calibri', bold: true });
  s4.addText(`Risk: ${riskScore.toFixed(1)} / 5`, { x: px + 0.25, y: 4.65, w: 3.1, h: 0.32, fontSize: 12, color: NAVY, fontFace: 'Calibri', bold: true });
  s4.addText(`Readiness: ${readinessScore.toFixed(1)} / 5`, { x: px + 0.25, y: 5.0, w: 3.1, h: 0.32, fontSize: 12, color: NAVY, fontFace: 'Calibri', bold: true });
  s4.addText(`Timeframe: ${timeframeScore.toFixed(1)} / 5`, { x: px + 0.25, y: 5.35, w: 3.1, h: 0.32, fontSize: 12, color: NAVY, fontFace: 'Calibri', bold: true });

  s4.addText('Up-and-right is the sweet spot. Larger bubble = readier to deliver.', { x: px + 0.25, y: 6.0, w: 3.1, h: 0.6, fontSize: 10, color: MUTE, fontFace: 'Calibri', italic: true });

  // Footer
  s4.addText('Simpson Associates · AI Use Case Prioritiser', { x: 0.6, y: 7.1, w: 8, h: 0.3, fontSize: 9, color: MUTE, fontFace: 'Calibri' });
  s4.addText('Page 4 of 5', { x: 11, y: 7.1, w: 1.7, h: 0.3, fontSize: 9, color: MUTE, fontFace: 'Calibri', align: 'right' });

  // ---------- SLIDE 5: QUESTION-BY-QUESTION DETAIL ----------
  const s5 = pptx.addSlide();
  s5.background = { color: PAPER };

  s5.addText('SCORING DETAIL', { x: 0.6, y: 0.4, w: 10, h: 0.3, fontSize: 11, color: TEAL, fontFace: 'Calibri', bold: true, charSpacing: 3 });
  s5.addText('How each score is built', { x: 0.6, y: 0.7, w: 12, h: 0.5, fontSize: 24, color: NAVY, fontFace: 'Georgia' });

  // Three columns
  const colData = [
    { dim: 'value', label: 'VALUE', colour: TEAL, qs: QUESTIONS.value },
    { dim: 'risk', label: 'RISK', colour: NAVY, qs: QUESTIONS.risk },
    { dim: 'readiness', label: 'READINESS', colour: '4A8E51', qs: QUESTIONS.readiness },
  ];

  const colW = 4.1;
  const colY = 1.5;
  const colX0 = 0.6;
  const colH = 5.5;

  colData.forEach((col, ci) => {
    const x = colX0 + ci * (colW + 0.05);

    // Column header
    s5.addShape(pptx.ShapeType.rect, { x, y: colY, w: colW, h: 0.4, fill: { color: col.colour }, line: { color: col.colour } });
    s5.addText(col.label, { x: x + 0.2, y: colY + 0.05, w: colW - 0.4, h: 0.3, fontSize: 11, color: 'FFFFFF', fontFace: 'Calibri', bold: true, charSpacing: 3 });

    // 5 questions stacked
    col.qs.forEach((q, qi) => {
      const qy = colY + 0.5 + qi * 1.0;
      const score = scores[q.id];
      const opt = q.scale.find(o => o.v === score);
      const note = rationale && rationale[q.id];

      // Card background
      s5.addShape(pptx.ShapeType.rect, { x, y: qy, w: colW, h: 0.95, fill: { color: 'FFFFFF' }, line: { color: 'E3E1D8' } });

      // Score pill
      s5.addShape(pptx.ShapeType.ellipse, { x: x + 0.15, y: qy + 0.18, w: 0.55, h: 0.55, fill: { color: 'F7F5EF' }, line: { color: col.colour, width: 1.5 } });
      s5.addText(`${score || '—'}`, { x: x + 0.15, y: qy + 0.18, w: 0.55, h: 0.55, fontSize: 18, color: NAVY, fontFace: 'Georgia', italic: true, align: 'center', valign: 'middle' });

      // Smart truncation — break at word boundaries
      const truncate = (str, maxLen) => {
        if (str.length <= maxLen) return str;
        const cut = str.substring(0, maxLen);
        const lastSpace = cut.lastIndexOf(' ');
        return (lastSpace > maxLen * 0.6 ? cut.substring(0, lastSpace) : cut) + '…';
      };

      // Question summary
      const qShort = truncate(q.text, 65);
      s5.addText(qShort, { x: x + 0.8, y: qy + 0.08, w: colW - 0.95, h: 0.34, fontSize: 9, color: NAVY, fontFace: 'Calibri', bold: true });

      // Answer label
      if (opt) {
        s5.addText(opt.label, { x: x + 0.8, y: qy + 0.4, w: colW - 0.95, h: 0.22, fontSize: 8, color: col.colour, fontFace: 'Calibri', bold: true });
      }

      // Rationale (or empty placeholder)
      if (note) {
        const noteShort = truncate(note, 160);
        s5.addText(noteShort, { x: x + 0.8, y: qy + 0.6, w: colW - 0.95, h: 0.32, fontSize: 7.5, color: MUTE, fontFace: 'Calibri', italic: true, valign: 'top' });
      }
    });
  });

  // Footer
  s5.addText('Simpson Associates · AI Use Case Prioritiser', { x: 0.6, y: 7.1, w: 8, h: 0.3, fontSize: 9, color: MUTE, fontFace: 'Calibri' });
  s5.addText('Page 5 of 5', { x: 11, y: 7.1, w: 1.7, h: 0.3, fontSize: 9, color: MUTE, fontFace: 'Calibri', align: 'right' });

  // Save
  const safeName = customerName.replace(/[^a-z0-9]/gi, '_');
  pptx.writeFile({ fileName: `${safeName}_AI_Use_Case_Assessment.pptx` });
}

function extractBriefUpdate(text) {
  const m = text.match(/\[\[BRIEF_UPDATE\]\]([\s\S]*?)\[\[\/BRIEF_UPDATE\]\]/);
  if (!m) return { cleaned: text, update: null };
  let update = null;
  try { update = JSON.parse(m[1].trim()); } catch (e) { update = null; }
  const cleaned = text.replace(/\[\[BRIEF_UPDATE\]\][\s\S]*?\[\[\/BRIEF_UPDATE\]\]/, '').trim();
  return { cleaned, update };
}

// Silent fallback: if the agent forgot to emit a BRIEF_UPDATE block, we fire a tiny
// non-streamed call asking it to extract what was just discussed into one.
// This is invisible to the user — no message appears, only the brief panel updates.
async function silentBriefExtract(apiKey, agentResponse, existingBrief) {
  const extractPrompt = `You are a JSON extraction assistant. Read the following agent response and extract any concrete recommendations into a BRIEF_UPDATE block.

The agent response to extract from:
---
${agentResponse.slice(0, 3000)}
---

Current brief state (do not repeat fields that already have good content unless this response significantly updates them):
${JSON.stringify(existingBrief, null, 2)}

Available fields: architecture, current_licensing, recommended_licensing, technical_requirements, data_requirements, environment_requirements, phase1, timeline, cost_band, roi_estimate, cost_vs_return, governance, first_90_days

Respond with ONLY a [[BRIEF_UPDATE]] block and nothing else. Each field value must be 1–3 sentences in British English. Only include fields where the agent response genuinely provides new, concrete information.

[[BRIEF_UPDATE]]{"field": "value"}[[/BRIEF_UPDATE]]`;

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001', // Use Haiku for this — cheap, fast, no streaming needed
        max_tokens: 400,
        messages: [{ role: 'user', content: extractPrompt }],
      }),
    });
    if (!resp.ok) return null;
    const data = await resp.json();
    const text = data.content?.map(b => b.text || '').join('') || '';
    const { update } = extractBriefUpdate(text);
    return update;
  } catch (e) {
    return null;
  }
}

// Very small markdown-ish renderer for chat bubbles (paragraphs, bold, lists, code).
function renderRichText(text) {
  if (!text) return null;
  const blocks = text.split(/\n{2,}/);
  return blocks.map((block, i) => {
    const trimmed = block.trim();
    if (!trimmed) return null;
    // unordered list
    if (trimmed.split('\n').every(line => /^\s*[-*]\s+/.test(line))) {
      const items = trimmed.split('\n').map(line => line.replace(/^\s*[-*]\s+/, ''));
      return (
        <ul key={i}>
          {items.map((it, j) => <li key={j}>{renderInline(it)}</li>)}
        </ul>
      );
    }
    // ordered list
    if (trimmed.split('\n').every(line => /^\s*\d+\.\s+/.test(line))) {
      const items = trimmed.split('\n').map(line => line.replace(/^\s*\d+\.\s+/, ''));
      return (
        <ol key={i}>
          {items.map((it, j) => <li key={j}>{renderInline(it)}</li>)}
        </ol>
      );
    }
    return <p key={i}>{renderInline(trimmed)}</p>;
  });
}

function renderInline(text) {
  // **bold** and `code`
  const parts = [];
  const regex = /(\*\*[^*]+\*\*|`[^`]+`)/g;
  let lastIdx = 0;
  let m;
  let key = 0;
  while ((m = regex.exec(text)) !== null) {
    if (m.index > lastIdx) parts.push(text.slice(lastIdx, m.index));
    if (m[0].startsWith('**')) {
      parts.push(<strong key={`b${key++}`}>{m[0].slice(2, -2)}</strong>);
    } else {
      parts.push(<code key={`c${key++}`}>{m[0].slice(1, -1)}</code>);
    }
    lastIdx = m.index + m[0].length;
  }
  if (lastIdx < text.length) parts.push(text.slice(lastIdx));
  return parts;
}

function FabricAgent({ customerName, useCaseName, scores, isPreloaded, isImaginary, onBack }) {
  const valueAvg = useMemo(() => avg(scores, QUESTIONS.value.map(q => q.id)), [scores]);
  const riskAvg = useMemo(() => avg(scores, QUESTIONS.risk.map(q => q.id)), [scores]);
  const readinessAvg = useMemo(() => avg(scores, QUESTIONS.readiness.map(q => q.id)), [scores]);
  const timeframeAvg = useMemo(() => avg(scores, QUESTIONS.timeframe.map(q => q.id)), [scores]);
  const verdict = useMemo(() => getVerdict(valueAvg, riskAvg, readinessAvg, timeframeAvg), [valueAvg, riskAvg, readinessAvg, timeframeAvg]);

  const [apiKey, setApiKey] = useState('');
  const [keyAccepted, setKeyAccepted] = useState(false);
  const [messages, setMessages] = useState([]); // [{role:'user'|'agent', text:'...'}]
  const [input, setInput] = useState('');
  const [isStreaming, setIsStreaming] = useState(false);
  const [error, setError] = useState(null);
  const [brief, setBrief] = useState({});
  const briefRef = useRef({}); // kept in sync so async callbacks always see current value
  const messagesEndRef = useRef(null);
  const initialised = useRef(false);

  // Keep briefRef in sync with brief state
  useEffect(() => { briefRef.current = brief; }, [brief]);

  const systemPrompt = useMemo(
    () => buildSystemPrompt(customerName, useCaseName, scores, valueAvg, riskAvg, readinessAvg, timeframeAvg, verdict, isPreloaded, isImaginary),
    [customerName, useCaseName, scores, valueAvg, riskAvg, readinessAvg, timeframeAvg, verdict, isPreloaded, isImaginary]
  );

  useEffect(() => {
    if (messagesEndRef.current) {
      messagesEndRef.current.scrollTop = messagesEndRef.current.scrollHeight;
    }
  }, [messages, isStreaming]);

  const callAgent = async (history, userText) => {
    setError(null);
    setIsStreaming(true);
    // Append user message immediately
    const newHistory = [...history, { role: 'user', text: userText }];
    setMessages(newHistory);

    // Add a placeholder agent message we'll stream into
    setMessages(prev => [...prev, { role: 'agent', text: '' }]);

    try {
      const apiMessages = newHistory.map(m => ({
        role: m.role === 'agent' ? 'assistant' : 'user',
        content: m.text,
      }));

      const resp = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-5',
          max_tokens: 2500,
          system: systemPrompt,
          messages: apiMessages,
          stream: true,
        }),
      });

      if (!resp.ok) {
        const errText = await resp.text();
        throw new Error(`API error ${resp.status}: ${errText.slice(0, 200)}`);
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let fullText = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop(); // keep partial

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const data = line.slice(6);
          if (data === '[DONE]') continue;
          try {
            const ev = JSON.parse(data);
            if (ev.type === 'content_block_delta' && ev.delta && ev.delta.type === 'text_delta') {
              fullText += ev.delta.text;
              setMessages(prev => {
                const next = [...prev];
                // Update only the latest agent message (preserve hidden BRIEF block while streaming)
                const lastIdx = next.length - 1;
                if (next[lastIdx] && next[lastIdx].role === 'agent') {
                  const { cleaned } = extractBriefUpdate(fullText);
                  next[lastIdx] = { ...next[lastIdx], text: cleaned || fullText };
                }
                return next;
              });
            }
          } catch (e) {
            // partial JSON, ignore
          }
        }
      }

      // Final pass: extract any brief update and clean the rendered text
      const { cleaned, update } = extractBriefUpdate(fullText);
      setMessages(prev => {
        const next = [...prev];
        const lastIdx = next.length - 1;
        if (next[lastIdx] && next[lastIdx].role === 'agent') {
          next[lastIdx] = { ...next[lastIdx], text: cleaned };
        }
        return next;
      });
      if (update) {
        setBrief(prev => ({ ...prev, ...update }));
      } else {
        // Agent forgot to emit a BRIEF_UPDATE block — fire a silent extraction call
        // using Haiku to keep it cheap and fast. User never sees this.
        silentBriefExtract(apiKey, cleaned || fullText, briefRef.current).then(fallbackUpdate => {
          if (fallbackUpdate) {
            setBrief(prev => ({ ...prev, ...fallbackUpdate }));
          }
        });
      }
    } catch (err) {
      setError(err.message || 'Something went wrong calling the agent.');
      // Remove the empty placeholder agent message
      setMessages(prev => {
        const next = [...prev];
        if (next.length && next[next.length - 1].role === 'agent' && !next[next.length - 1].text) {
          next.pop();
        }
        return next;
      });
    } finally {
      setIsStreaming(false);
    }
  };

  const handleStart = () => {
    if (!apiKey.trim().startsWith('sk-ant-')) {
      setError('That doesn\'t look like an Anthropic API key. It should start with "sk-ant-".');
      return;
    }
    setError(null);
    setKeyAccepted(true);
    // Kick off the agent's opening message
    setTimeout(() => {
      callAgent([], 'Please greet me and walk me through how you\'d approach this engagement based on the PRISM scores you can see.');
    }, 100);
  };

  const handleSend = () => {
    const text = input.trim();
    if (!text || isStreaming) return;
    setInput('');
    callAgent(messages, text);
  };

  const handleKeyDown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  };

  // Suggested follow-up prompts
  const suggestions = [
    'Show me the ROI maths for this fraud use case',
    'What licensing would we actually need on Fabric?',
    'What does the data need to look like in OneLake?',
    'What would the first 90 days look like?',
    'How would governance work for FCA regulation?',
    'What\'s a realistic cost vs return picture?',
  ];

  // ====== API KEY ENTRY SCREEN ======
  if (!keyAccepted) {
    return (
      <div className="page">
        <button
          className="btn btn-ghost"
          onClick={onBack}
          style={{ marginBottom: 20, marginLeft: -8 }}
        >← Back to results</button>

        <div className="api-key-prompt">
          <div className="eyebrow">Step 1 of 2 · Connect the Agent</div>
          <h2>Activate the Fabric Implementation Agent</h2>
          <p className="lead">
            The agent reasons live against your PRISM scores, Simpson Associates' delivery playbooks
            and the Microsoft Fabric architecture for fraud detection. To do that, it needs an
            Anthropic API key.
          </p>

          <div className="note">
            <strong>Demo-grade only.</strong> The key stays in this browser tab and is sent directly
            to Anthropic — nothing is stored or proxied. In a production Simpson deployment we'd put
            this behind an Azure Function or API Management gateway so the key never touches the
            client.
          </div>

          <label>
            <span>Anthropic API key</span>
            <input
              type="password"
              placeholder="sk-ant-..."
              value={apiKey}
              onChange={(e) => setApiKey(e.target.value)}
              onKeyDown={(e) => { if (e.key === 'Enter') handleStart(); }}
            />
          </label>

          {error && <div className="agent-error">{error}</div>}

          <button className="activate-cta" onClick={handleStart} style={{ marginTop: 8 }}>
            Activate Agent →
          </button>
        </div>
      </div>
    );
  }

  // ====== AGENT WORKSPACE ======
  return (
    <div className="agent-page">
      <button
        className="btn btn-ghost"
        onClick={onBack}
        style={{ marginBottom: 20, marginLeft: -8 }}
      >← Back to results</button>

      <div className="agent-header">
        <div>
          <div className="eyebrow">Fabric Implementation Agent · Live</div>
          <h1>What Simpson would build for <em style={{ fontStyle: 'italic', color: 'var(--sa-teal-deep)' }}>{customerName}</em></h1>
          <p className="sub">
            The agent has ingested your PRISM scores, Simpson's delivery playbook for fraud detection
            and the Microsoft Fabric reference architecture. Ask anything — it's grounded in your assessment.
          </p>
        </div>
      </div>

      <div className="agent-grid">
        {/* LEFT: Context */}
        <aside className="agent-context">
          <div>
            <h3>What the agent knows</h3>
          </div>

          <div className="ctx-block">
            <div className="ctx-label">Customer</div>
            <div className="ctx-value">{customerName}</div>
            <div className="ctx-label" style={{ marginTop: 10 }}>Use Case</div>
            <div className="ctx-value">{useCaseName}</div>
          </div>

          <div className="ctx-block">
            <div className="ctx-label">PRISM Result</div>
            <div className="ctx-scores">
              <div className="ctx-score">
                <div className="lbl">Value</div>
                <div className="num">{valueAvg.toFixed(1)}</div>
              </div>
              <div className="ctx-score">
                <div className="lbl">Risk</div>
                <div className="num">{riskAvg.toFixed(1)}</div>
              </div>
              <div className="ctx-score">
                <div className="lbl">Ready</div>
                <div className="num">{readinessAvg.toFixed(1)}</div>
              </div>
              <div className="ctx-score">
                <div className="lbl">Time</div>
                <div className="num">{timeframeAvg.toFixed(1)}</div>
              </div>
            </div>
            <div style={{ fontSize: 12, color: 'var(--sa-mute)', marginTop: 10, lineHeight: 1.4, fontStyle: 'italic' }}>
              "{verdict.title}"
            </div>
          </div>

          <div className="ctx-block">
            <div className="ctx-label">Knowledge Sources</div>
            <div className="ctx-knows">
              <div className="ctx-knows-item">Your PRISM scores & rationale (4 dimensions)</div>
              <div className="ctx-knows-item">Microsoft Fabric reference architecture for fraud detection</div>
              <div className="ctx-knows-item">Fabric capacity SKU sizing & licensing</div>
              <div className="ctx-knows-item">Industry fraud detection ROI maths</div>
              <div className="ctx-knows-item">Simpson's PoV delivery playbook</div>
              <div className="ctx-knows-item">Purview governance pattern for regulated AI</div>
              <div className="ctx-knows-item">Databricks ↔ Fabric interop on OneLake</div>
            </div>
          </div>

          <div className="ctx-block">
            <div className="ctx-label">Powered by</div>
            <div style={{ fontSize: 12, color: 'var(--sa-mute)', lineHeight: 1.5 }}>
              Claude Sonnet 4.5 via Anthropic API. In production: behind Azure API Management,
              with Purview audit on every prompt.
            </div>
          </div>
        </aside>

        {/* CENTRE: Chat */}
        <main className="agent-chat">
          <div className="agent-chat-header">
            <div className="agent-avatar">
              <svg viewBox="0 0 100 115" preserveAspectRatio="xMidYMid meet">
                <path d={HEX_PATH} fill="#00B0B9" />
                <text x="50" y="72" textAnchor="middle" fill="white" fontFamily="Manrope" fontWeight="800" fontSize="40">F</text>
              </svg>
            </div>
            <div>
              <div className="who">Fabric Implementation Agent</div>
              <div className="role">Simpson Associates · Reasoning Live</div>
            </div>
            <div className="status">Online</div>
          </div>

          <div className="agent-messages" ref={messagesEndRef}>
            {messages.length === 0 && (
              <div style={{ color: 'var(--sa-mute)', fontSize: 13, fontStyle: 'italic', textAlign: 'center', padding: 24 }}>
                Connecting to the agent...
              </div>
            )}
            {messages.map((m, i) => {
              const isLastAgent = m.role === 'agent' && i === messages.length - 1;
              const showTyping = isLastAgent && isStreaming && !m.text;
              return (
                <div key={i} className={`msg ${m.role}`}>
                  {m.role === 'agent' ? (
                    <div className="msg-avatar">
                      <svg viewBox="0 0 100 115" preserveAspectRatio="xMidYMid meet">
                        <path d={HEX_PATH} fill="#0F2D52" />
                        <text x="50" y="72" textAnchor="middle" fill="#00B0B9" fontFamily="Manrope" fontWeight="800" fontSize="40">F</text>
                      </svg>
                    </div>
                  ) : (
                    <div className="msg-avatar">You</div>
                  )}
                  <div className="msg-bubble">
                    {showTyping ? (
                      <div className="typing"><span></span><span></span><span></span></div>
                    ) : (
                      renderRichText(m.text)
                    )}
                  </div>
                </div>
              );
            })}
            {error && <div className="agent-error">{error}</div>}
          </div>

          {!isStreaming && messages.length > 0 && (
            <div className="suggested-prompts">
              {suggestions.map((s, i) => (
                <button
                  key={i}
                  className="suggested-prompt"
                  onClick={() => { setInput(s); }}
                >
                  {s}
                </button>
              ))}
            </div>
          )}

          <div className="agent-input-row">
            <textarea
              className="agent-input"
              placeholder="Ask the agent about architecture, governance, cost, timeline..."
              value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={handleKeyDown}
              rows={1}
              disabled={isStreaming}
            />
            <button className="send-btn" onClick={handleSend} disabled={isStreaming || !input.trim()}>
              {isStreaming ? 'Thinking...' : 'Send →'}
            </button>
          </div>
        </main>

        {/* RIGHT: Implementation Brief */}
        <aside className="agent-brief">
          <h3>Implementation Brief</h3>
          {Object.keys(brief).length === 0 ? (
            <div className="brief-empty">
              As the agent proposes concrete recommendations, they'll appear here as a draft brief
              you can take into a follow-up workshop.
            </div>
          ) : (
            <>
              {brief.architecture && (
                <div className="brief-section">
                  <div className="label">Recommended Architecture</div>
                  <div className="body">{brief.architecture}</div>
                </div>
              )}
              {brief.data_requirements && (
                <div className="brief-section">
                  <div className="label">Data Requirements</div>
                  <div className="body">{brief.data_requirements}</div>
                </div>
              )}
              {brief.environment_requirements && (
                <div className="brief-section">
                  <div className="label">Environment Requirements</div>
                  <div className="body">{brief.environment_requirements}</div>
                </div>
              )}
              {brief.technical_requirements && (
                <div className="brief-section">
                  <div className="label">Technical Requirements</div>
                  <div className="body">{brief.technical_requirements}</div>
                </div>
              )}
              {brief.current_licensing && (
                <div className="brief-section">
                  <div className="label">Current Licensing</div>
                  <div className="body">{brief.current_licensing}</div>
                </div>
              )}
              {brief.recommended_licensing && (
                <div className="brief-section">
                  <div className="label">Recommended Licensing</div>
                  <div className="body">{brief.recommended_licensing}</div>
                </div>
              )}
              {brief.phase1 && (
                <div className="brief-section">
                  <div className="label">Phase 1 — Proof of Value</div>
                  <div className="body">{brief.phase1}</div>
                </div>
              )}
              {brief.timeline && (
                <div className="brief-section">
                  <div className="label">Indicative Timeline</div>
                  <div className="body">{brief.timeline}</div>
                </div>
              )}
              {brief.cost_band && (
                <div className="brief-section">
                  <div className="label">Cost Band</div>
                  <div className="body">{brief.cost_band}</div>
                </div>
              )}
              {brief.roi_estimate && (
                <div className="brief-section">
                  <div className="label">ROI Estimate</div>
                  <div className="body">{brief.roi_estimate}</div>
                </div>
              )}
              {brief.cost_vs_return && (
                <div className="brief-section">
                  <div className="label">Cost vs Return</div>
                  <div className="body">{brief.cost_vs_return}</div>
                </div>
              )}
              {brief.governance && (
                <div className="brief-section">
                  <div className="label">Governance & Responsible AI</div>
                  <div className="body">{brief.governance}</div>
                </div>
              )}
              {brief.first_90_days && (
                <div className="brief-section">
                  <div className="label">First 90 Days</div>
                  <div className="body">{brief.first_90_days}</div>
                </div>
              )}
            </>
          )}
        </aside>
      </div>
    </div>
  );
}

// ============================================================
// ROOT
// ============================================================
function App() {
  const [stage, setStage] = useState('landing'); // landing | assess | results | agent
  const [scores, setScores] = useState({});
  const [customerName, setCustomerName] = useState('');
  const [useCaseName, setUseCaseName] = useState('');
  const [isPreloaded, setIsPreloaded] = useState(false);
  const [isImaginary, setIsImaginary] = useState(false);
  const [preloadedHeadlines, setPreloadedHeadlines] = useState(null);
  const [rationale, setRationale] = useState(null);

  const startBlank = () => {
    setScores({});
    setCustomerName('');
    setUseCaseName('');
    setIsPreloaded(false);
    setIsImaginary(false);
    setPreloadedHeadlines(null);
    setRationale(null);
    setStage('assess');
  };

  const loadCase = (key) => {
    const c = PRELOADED[key];
    setScores(c.scores);
    setCustomerName(c.customer);
    setUseCaseName(c.useCase);
    setIsPreloaded(true);
    setIsImaginary(!!c.isImaginary);
    setPreloadedHeadlines(c.headlines);
    setRationale(c.rationale || null);
    setStage('results');
  };

  const restart = () => {
    setStage('landing');
    setScores({});
    setCustomerName('');
    setUseCaseName('');
    setIsPreloaded(false);
    setIsImaginary(false);
    setPreloadedHeadlines(null);
    setRationale(null);
  };

  const handleExport = () => {
    exportPpt(scores, customerName, useCaseName, isPreloaded, preloadedHeadlines, rationale);
  };

  return (
    <div className="app">
      <div className="topbar">
        <Logo />
        <div className="topbar-right">
          <span className="pill">AI Use Case Prioritiser · Concept</span>
        </div>
      </div>

      {stage === 'landing' && <Landing onStartBlank={startBlank} onLoadCase={loadCase} />}
      {stage === 'assess' && (
        <Assessment
          scores={scores}
          setScores={setScores}
          onComplete={() => setStage('results')}
          onBack={restart}
          customerName={customerName}
          setCustomerName={setCustomerName}
          useCaseName={useCaseName}
          setUseCaseName={setUseCaseName}
        />
      )}
      {stage === 'results' && (
        <Results
          scores={scores}
          customerName={customerName}
          useCaseName={useCaseName}
          onRestart={restart}
          onExport={handleExport}
          onActivateAgent={() => setStage('agent')}
          isPreloaded={isPreloaded}
          preloadedHeadlines={preloadedHeadlines}
          rationale={rationale}
        />
      )}
      {stage === 'agent' && (
        <FabricAgent
          customerName={customerName}
          useCaseName={useCaseName}
          scores={scores}
          isPreloaded={isPreloaded}
          isImaginary={isImaginary}
          onBack={() => setStage('results')}
        />
      )}

      <div className="footer-bar">
        <div>© 2026 · A concept built for Simpson Associates by Luke Craven</div>
        <div className="badge-row">
          <span>Inspired by Zygens DDAD · Simplified for Presales</span>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
